<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>后台 · 站点管理 | 空曙</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
    <style>
        .admin-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 1.6rem 0 1.2rem; }
        .admin-section { display: none; }
        .admin-section.on { display: block; }
        .kv { display: flex; gap: 10px; padding: .5rem 0; border-bottom: 1px dashed var(--line-2); font-size: .9rem; flex-wrap: wrap; }
        .kv b { color: var(--ink); }
        .kv .k { color: var(--ink-3); min-width: 7em; }
    </style>
</head>
<body data-page="admin">
<main class="central">
    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="pageContent">
        <div class="section-head">🛠 后台 · 站点管理</div>
        <p class="section-sub">所有账号都有权访问。数据都存在 Supabase，这里只做查看与管理。</p>

        <div class="stat-cards" id="statCards"></div>

        <div class="admin-nav" id="adminNav">
            <button class="tab-btn on" data-sec="account">👤 账号</button>
            <button class="tab-btn" data-sec="surveys">📋 问卷管理</button>
            <button class="tab-btn" data-sec="data">💾 数据备份</button>
            <button class="tab-btn" data-sec="sql">🗄 数据库安装</button>
            <button class="tab-btn" data-sec="help">📖 使用说明</button>
        </div>

        <!-- 账号 -->
        <section class="admin-section on" id="sec-account">
            <div class="card" style="cursor:default;">
                <h3>当前账号</h3>
                <div id="accountInfo"></div>
                <div class="notice" style="margin-top:1rem;">
                    整站只有两个账号，权限完全一样。想加她 的账号：
                    ① Supabase 控制台 → Authentication → Users → Add user（记得关掉邮箱确认或勾 Auto Confirm）；
                    ② 在下面「数据库安装」里执行 members 表的 insert 语句（role 填 <code>admin</code>）。
                </div>
            </div>
        </section>

        <!-- 问卷管理 -->
        <section class="admin-section" id="sec-surveys">
            <div class="card" style="cursor:default;">
                <h3>问卷管理</h3>
                <p>在「问卷小屋」里设计和作答；这里可以总览与删除。</p>
                <div id="surveyAdminList"></div>
            </div>
        </section>

        <!-- 数据备份 -->
        <section class="admin-section" id="sec-data">
            <div class="card" style="cursor:default;">
                <h3>日记 & 思辨 · 导出 / 导入</h3>
                <p>entries 表的全部内容（27 篇日记 + 思辨都在里面），导出成 JSON 备份；导入按 id 合并覆盖。</p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;">
                    <button class="btn blue" id="exportBtn">⬇️ 导出全部 entries</button>
                    <button class="btn ghost" id="exportSurveyBtn">⬇️ 导出问卷数据</button>
                </div>
                <div class="field"><label>导入 entries JSON<span class="hint">粘贴备份文件内容，按 id 合并</span></label>
                    <textarea class="textarea" id="importArea" style="min-height:150px;" placeholder='[{"id":"d2026-04-06-xxxxx","kind":"journal",...}]'></textarea></div>
                <button class="btn" id="importBtn">⬆️ 导入并合并</button>
            </div>
        </section>

        <!-- 数据库安装 -->
        <section class="admin-section" id="sec-sql">
            <div class="card" style="cursor:default;">
                <h3>数据库安装 SQL</h3>
                <p>在 Supabase 控制台 → SQL Editor 里执行一次即可（可重复执行）。包含：账号表、日记/思辨表、问卷三张表与全部行级安全策略。</p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.8rem;">
                    <button class="btn sm blue" id="copySqlBtn">📋 复制全部 SQL</button>
                </div>
                <pre class="code-block" id="sqlBlock"></pre>
            </div>
        </section>

        <!-- 使用说明 -->
        <section class="admin-section" id="sec-help">
            <div class="card" style="cursor:default;">
                <h3>这套站怎么运转</h3>
                <div class="kv"><span class="k">登录</span><span>整站所有内容都要登录。账号只有两个（你和她），存在 Supabase Authentication；授权名单在 <b>members</b> 表。</span></div>
                <div class="kv"><span class="k">日记/思辨</span><span><b>entries</b> 表，kind 字段区分 journal / philosophy；登录后即可读写。</span></div>
                <div class="kv"><span class="k">问卷</span><span><b>surveys</b> + <b>survey_questions</b> + <b>survey_responses</b> 三张表；每人每卷一份答卷，重复提交即覆盖；结果双方互看。</span></div>
                <div class="kv"><span class="k">留言</span><span>已按计划移除（comments 模块与表策略不再使用）。</span></div>
                <div class="kv"><span class="k">问卷文本格式</span><span><code># 标题</code> / <code>&gt; 描述</code> / <code>1. 题干 [单选|多选|文本]</code> / <code>- 选项</code>；「问卷小屋 → 设计问卷 → AI 提示词」里有一键复制的提示词。</span></div>
                <div class="kv"><span class="k">安全</span><span>anon key 本来就是公开的，真正的权限由 RLS（行级安全策略）保证：不是成员，连一行都读不到。</span></div>
            </div>
        </section>
    </template>

    <footer class="page-foot">✦ 逝影回声 · 所有灵感皆成历史档案 ✦</footer>
</main>

<script src="./assets/app-core.js"></script>
<script>
/* ====================== 数据库安装 SQL ====================== */
const INSTALL_SQL = [
    '-- ===== 空曙 · 记忆回廊 数据库安装（可重复执行）=====',
    '-- ① 先在 Authentication → Users 里建账号（两个人的都建）',
    '-- ② members 表：两个人的 role 都填 admin（权限完全一样）',
    '',
    'create table if not exists public.members (',
    '  email        text primary key,',
    "  role         text not null default 'guest' check (role in ('guest','admin')),",
    '  display_name text,',
    '  created_at   timestamptz not null default now()',
    ');',
    'alter table public.members enable row level security;   -- 不建策略：只有 Supabase 后台能改',
    "insert into public.members (email, role, display_name) values ('dreemurrdawnlit@outlook.com', 'admin', '空曙') on conflict (email) do update set role = 'admin';",
    "-- 她的账号：去掉下一行注释、改成她的邮箱再执行",
    "-- insert into public.members (email, role, display_name) values ('她的邮箱', 'admin', '她') on conflict (email) do update set role = 'admin';",
    '',
    '-- ===== 权限函数 =====',
    'create or replace function public.my_profile() returns jsonb',
    'language sql stable security definer set search_path = public as $$',
    '  select coalesce(jsonb_build_object(',
    '    \'email\', m.email, \'role\', m.role, \'display_name\', m.display_name),',
    '    jsonb_build_object(\'email\', coalesce(auth.jwt() ->> \'email\', \'\'), \'role\', \'none\', \'display_name\', \'\'))',
    '  from public.members m',
    '  where lower(m.email) = lower(coalesce(auth.jwt() ->> \'email\', \'\'))',
    '$$;',
    'create or replace function public.is_admin() returns boolean',
    'language sql stable security definer set search_path = public as $$',
    "  select coalesce((select m.role from public.members m where lower(m.email) = lower(coalesce(auth.jwt() ->> 'email',''))), 'none') = 'admin';",
    '$$;',
    'create or replace function public.is_member() returns boolean',
    'language sql stable security definer set search_path = public as $$',
    "  select coalesce((select m.role from public.members m where lower(m.email) = lower(coalesce(auth.jwt() ->> 'email',''))), 'none') in ('guest','admin');",
    '$$;',
    '',
    '-- ===== 日记 / 思辨（entries）=====',
    'create table if not exists public.entries (',
    '  id         text primary key,',
    "  kind       text not null default 'journal' check (kind in ('journal','philosophy')),",
    '  date       text not null,',
    "  mood       text not null default '',",
    "  title      text not null default '',",
    "  content    text not null default '',",
    '  created_at timestamptz not null default now(),',
    '  updated_at timestamptz not null default now()',
    ');',
    'create index if not exists entries_kind_date_idx on public.entries (kind, date);',
    'alter table public.entries enable row level security;',
    'drop policy if exists entries_read on public.entries;',
    'drop policy if exists entries_admin_insert on public.entries;',
    'drop policy if exists entries_admin_update on public.entries;',
    'drop policy if exists entries_admin_delete on public.entries;',
    'create policy entries_read on public.entries for select to authenticated using (public.is_member());',
    'create policy entries_admin_insert on public.entries for insert to authenticated with check (public.is_admin());',
    'create policy entries_admin_update on public.entries for update to authenticated using (public.is_admin());',
    'create policy entries_admin_delete on public.entries for delete to authenticated using (public.is_admin());',
    '',
    '-- ===== 问卷三表 =====',
    'create table if not exists public.surveys (',
    '  id          text primary key,',
    '  title       text not null,',
    "  description text not null default '',",
    "  created_by  text not null default '',",
    '  created_at  timestamptz not null default now()',
    ');',
    'create table if not exists public.survey_questions (',
    '  id        bigint generated by default as identity primary key,',
    '  survey_id text not null references public.surveys(id) on delete cascade,',
    '  idx       int  not null default 0,',
    "  qtype     text not null default 'single' check (qtype in ('single','multi','text')),",
    '  prompt    text not null,',
    "  options   jsonb not null default '[]'::jsonb",
    ');',
    'create table if not exists public.survey_responses (',
    '  id              bigint generated by default as identity primary key,',
    '  survey_id       text not null references public.surveys(id) on delete cascade,',
    '  responder_email text not null,',
    "  answers         jsonb not null default '{}'::jsonb,",
    '  submitted_at    timestamptz not null default now(),',
    '  updated_at      timestamptz not null default now(),',
    '  unique (survey_id, responder_email)',
    ');',
    'alter table public.surveys enable row level security;',
    'alter table public.survey_questions enable row level security;',
    'alter table public.survey_responses enable row level security;',
    'drop policy if exists surveys_read   on public.surveys;',
    'drop policy if exists surveys_insert on public.surveys;',
    'drop policy if exists surveys_update on public.surveys;',
    'drop policy if exists surveys_delete on public.surveys;',
    'drop policy if exists sq_read   on public.survey_questions;',
    'drop policy if exists sq_insert on public.survey_questions;',
    'drop policy if exists sq_update on public.survey_questions;',
    'drop policy if exists sq_delete on public.survey_questions;',
    'drop policy if exists sr_read   on public.survey_responses;',
    'drop policy if exists sr_insert on public.survey_responses;',
    'drop policy if exists sr_update on public.survey_responses;',
    'drop policy if exists sr_delete on public.survey_responses;',
    'create policy surveys_read   on public.surveys for select to authenticated using (public.is_member());',
    'create policy surveys_insert on public.surveys for insert to authenticated with check (public.is_member());',
    'create policy surveys_update on public.surveys for update to authenticated using (public.is_member());',
    'create policy surveys_delete on public.surveys for delete to authenticated using (public.is_member());',
    'create policy sq_read   on public.survey_questions for select to authenticated using (public.is_member());',
    'create policy sq_insert on public.survey_questions for insert to authenticated with check (public.is_member());',
    'create policy sq_update on public.survey_questions for update to authenticated using (public.is_member());',
    'create policy sq_delete on public.survey_questions for delete to authenticated using (public.is_member());',
    'create policy sr_read   on public.survey_responses for select to authenticated using (public.is_member());',
    'create policy sr_insert on public.survey_responses for insert to authenticated with check (public.is_member());',
    'create policy sr_update on public.survey_responses for update to authenticated using (public.is_member());',
    'create policy sr_delete on public.survey_responses for delete to authenticated using (public.is_member());'
].join('\n');

(async function () {
    const app = await SiteApp.init({ active: 'admin', main: '#pageMain' });
    if (!app.me) return;
    const main = document.getElementById('pageMain');
    main.innerHTML = '';
    main.appendChild(document.getElementById('pageContent').content.cloneNode(true));

    const esc = SiteApp.esc;
    const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('zh-CN', { hour12: false }); };

    /* ---------- 统计 ---------- */
    try {
        const [je, pe, sv, rs] = await Promise.all([
            app.sbRest('entries?kind=eq.journal&select=id'),
            app.sbRest('entries?kind=eq.philosophy&select=id'),
            app.sbRest('surveys?select=id'),
            app.sbRest('survey_responses?select=id')
        ]).catch(() => null);
        const cards = [
            ['📓 日常想法', (je || []).length + ' 条'],
            ['⚖️ 思辨话题', (pe || []).length + ' 条'],
            ['📋 问卷', (sv || []).length + ' 份'],
            ['📨 答卷', (rs || []).length + ' 份']
        ];
        document.getElementById('statCards').innerHTML = cards.map(c =>
            '<div class="stat-card"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>').join('');
    } catch (e) {
        document.getElementById('statCards').innerHTML =
            '<div class="notice" style="grid-column:1/-1;">统计加载失败：' + esc(e.message) + '（可能需要先执行数据库安装 SQL）</div>';
    }

    /* ---------- 账号 ---------- */
    document.getElementById('accountInfo').innerHTML =
        '<div class="kv"><span class="k">邮箱</span><b>' + esc(app.me.email) + '</b></div>' +
        '<div class="kv"><span class="k">称呼</span><b>' + esc(app.me.display_name || '（未设置，可在 members 表里填 display_name）') + '</b></div>' +
        '<div class="kv"><span class="k">权限</span><b>成员（可读可写，和另一个账号完全一样）</b></div>';

    /* ---------- 分区切换 ---------- */
    document.querySelectorAll('#adminNav .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#adminNav .tab-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('on'));
            document.getElementById('sec-' + btn.dataset.sec).classList.add('on');
            if (btn.dataset.sec === 'surveys') renderSurveyAdmin();
        });
    });

    /* ---------- 问卷管理 ---------- */
    async function renderSurveyAdmin() {
        const host = document.getElementById('surveyAdminList');
        try {
            const surveys = (await app.sbRest('surveys?select=*&order=created_at.desc')) || [];
            if (!surveys.length) { host.innerHTML = '<div class="empty-state">还没有问卷。去「问卷小屋」出第一份题。</div>'; return; }
            host.innerHTML = surveys.map(s =>
                '<div class="kv"><span class="k">' + fmtTime(s.created_at) + '</span>' +
                '<b>' + esc(s.title) + '</b>' +
                '<span style="flex:1;"></span>' +
                '<button class="btn sm danger" data-del="' + esc(s.id) + '">🗑 删除</button></div>').join('');
            host.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('确定删除这份问卷？题目和答卷都会一起删除。')) return;
                    try {
                        await app.sbRest('surveys?id=eq.' + encodeURIComponent(btn.dataset.del), { method: 'DELETE' });
                        SiteApp.toast('已删除', 'ok');
                        renderSurveyAdmin();
                    } catch (e) { SiteApp.toast('删除失败：' + e.message, 'err', 4000); }
                });
            });
        } catch (e) {
            host.innerHTML = '<div class="notice">加载失败：' + esc(e.message) + '</div>';
        }
    }

    /* ---------- 导出 / 导入 ---------- */
    function downloadJson(name, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }
    document.getElementById('exportBtn').addEventListener('click', async () => {
        try {
            const rows = await app.sbRest('entries?select=*&order=date.asc');
            downloadJson('entries-backup-' + new Date().toISOString().slice(0, 10) + '.json', rows);
            SiteApp.toast('已导出 ' + rows.length + ' 条 💾', 'ok');
        } catch (e) { SiteApp.toast('导出失败：' + e.message, 'err', 4000); }
    });
    document.getElementById('exportSurveyBtn').addEventListener('click', async () => {
        try {
            const [s, q, r] = await Promise.all([
                app.sbRest('surveys?select=*'),
                app.sbRest('survey_questions?select=*'),
                app.sbRest('survey_responses?select=*')
            ]);
            downloadJson('surveys-backup-' + new Date().toISOString().slice(0, 10) + '.json', { surveys: s, questions: q, responses: r });
            SiteApp.toast('问卷数据已导出 💾', 'ok');
        } catch (e) { SiteApp.toast('导出失败：' + e.message, 'err', 4000); }
    });
    document.getElementById('importBtn').addEventListener('click', async () => {
        const raw = document.getElementById('importArea').value.trim();
        if (!raw) { SiteApp.toast('先粘贴 JSON 内容', 'err'); return; }
        let rows;
        try { rows = JSON.parse(raw); } catch (e) { SiteApp.toast('JSON 解析失败：' + e.message, 'err', 4000); return; }
        if (!Array.isArray(rows) || !rows.length) { SiteApp.toast('内容要是非空的数组', 'err'); return; }
        if (!confirm('将导入 ' + rows.length + ' 条并按 id 覆盖合并，继续？')) return;
        try {
            await app.sbRest('entries', {
                method: 'POST',
                prefer: 'resolution=merge-duplicates',
                body: rows.map(r => ({
                    id: r.id, kind: r.kind, date: r.date,
                    mood: r.mood || '', title: r.title || '', content: r.content || '',
                    created_at: r.created_at || new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }))
            });
            SiteApp.toast('导入完成 ✨', 'ok');
            document.getElementById('importArea').value = '';
        } catch (e) { SiteApp.toast('导入失败：' + e.message, 'err', 4200); }
    });

    /* ---------- SQL ---------- */
    document.getElementById('sqlBlock').textContent = INSTALL_SQL;
    document.getElementById('copySqlBtn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(INSTALL_SQL);
            SiteApp.toast('SQL 已复制，去 Supabase SQL Editor 执行 🛠', 'ok');
        } catch (e) { SiteApp.toast('复制失败，请手动全选复制', 'err'); }
    });
})();
</script>
</body>
</html>
