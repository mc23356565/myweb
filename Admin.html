<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>后台 · 站点管理</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./Style/css/content.css">
    <link rel="stylesheet" href="./Style/css/index.css">
    <link rel="stylesheet" href="./Style/css/animate.min.css">
    <link rel="stylesheet" href="./Style/css/ops.css">
    <style>
        .admin-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 1.6rem 0 1.2rem; }
        .admin-section { display: none; }
        .admin-section.on { display: block; }
        .kv { display: flex; gap: 10px; padding: .5rem 0; border-bottom: 1px dashed var(--line-2); font-size: .9rem; flex-wrap: wrap; }
        .kv b { color: var(--ink); }
        .kv .k { color: var(--ink-3); min-width: 7em; }
    </style>
</head>
<body data-page="admin">
<main class="central">
    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="pageContent">
        <div class="section-head">🛠 后台 · 站点管理</div>
        <p class="section-sub">所有账号都有权访问。数据都存在 Supabase，这里只做查看与管理。</p>

        <div class="stat-cards" id="statCards"></div>

        <div class="admin-nav" id="adminNav">
            <button class="tab-btn on" data-sec="couple">💑 情侣配置</button>
            <button class="tab-btn" data-sec="account">👤 账号</button>
            <button class="tab-btn" data-sec="surveys">📋 问卷管理</button>
            <button class="tab-btn" data-sec="data">💾 数据备份</button>
            <button class="tab-btn" data-sec="sql">🗄 数据库安装</button>
            <button class="tab-btn" data-sec="help">📖 使用说明</button>
        </div>

        <!-- 情侣配置 -->
        <section class="admin-section on" id="sec-couple">
            <div class="card" style="cursor:default;">
                <h3>💑 情侣配置</h3>
                <p>站点名称、顶栏文案、两人名字、头像、网页背景、纪念日（主厅计时器起点）。改完保存，全站立刻生效。</p>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 1.2rem;">
                    <div class="field"><label>站点名称（顶栏 logo / 浏览器标题）</label>
                        <input class="input" id="cfgTitle" autocomplete="off"></div>
                    <div class="field"><label>顶栏文案</label>
                        <input class="input" id="cfgSlogan" autocomplete="off"></div>
                    <div class="field"><label>他的名字（左头像下面）</label>
                        <input class="input" id="cfgNameA" autocomplete="off"></div>
                    <div class="field"><label>她的名字（右头像下面）</label>
                        <input class="input" id="cfgNameB" autocomplete="off"></div>
                    <div class="field"><label>纪念日（在一起的日子，计时器起点）</label>
                        <input class="input" type="date" id="cfgSince"></div>
                </div>
                <div style="display:flex;gap:2.4rem;flex-wrap:wrap;margin:0 0 1.2rem;">
                    <div>
                        <label style="display:block;font-size:.84rem;font-weight:700;color:var(--ink-2);margin-bottom:.4rem;">他的头像<span class="hint">选新图片即替换</span></label>
                        <img id="avaAPrev" src="./assets/avatar-a.svg" alt="" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--line-2);display:block;margin-bottom:.5rem;background:#fff;">
                        <input class="input" type="file" id="cfgAvaA" accept="image/*" style="max-width:240px;padding:.3rem;">
                    </div>
                    <div>
                        <label style="display:block;font-size:.84rem;font-weight:700;color:var(--ink-2);margin-bottom:.4rem;">她的头像<span class="hint">选新图片即替换</span></label>
                        <img id="avaBPrev" src="./assets/avatar-b.svg" alt="" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--line-2);display:block;margin-bottom:.5rem;background:#fff;">
                        <input class="input" type="file" id="cfgAvaB" accept="image/*" style="max-width:240px;padding:.3rem;">
                    </div>
                    <div>
                        <label style="display:block;font-size:.84rem;font-weight:700;color:var(--ink-2);margin-bottom:.4rem;">网页背景<span class="hint">上传 / 贴图链，清空恢复网格纸</span></label>
                        <img id="bgPrev" alt="" style="width:150px;height:84px;border-radius:.6rem;object-fit:cover;border:3px solid var(--line-2);display:block;margin-bottom:.5rem;background:#fff;">
                        <input class="input" type="file" id="cfgBgFile" accept="image/*" style="max-width:240px;padding:.3rem;margin-bottom:.4rem;">
                        <input class="input" id="cfgBg" placeholder="或直接粘贴图片链接 https://…" autocomplete="off" style="max-width:240px;">
                    </div>
                </div>
                <button class="btn blue" id="cfgSave">💾 保存配置</button>
                <div id="cfgMsg" style="margin-top:.6rem;font-size:.85rem;color:var(--ink-2);min-height:1.2em;"></div>
            </div>
        </section>

        <!-- 账号 -->
        <section class="admin-section on" id="sec-account">
            <div class="card" style="cursor:default;">
                <h3>当前账号</h3>
                <div id="accountInfo"></div>
                <div class="notice" style="margin-top:1rem;">
                    整站只有两个账号，权限完全一样。想加她 的账号：
                    ① Supabase 控制台 → Authentication → Users → Add user（记得关掉邮箱确认或勾 Auto Confirm）；
                    ② 在下面「数据库安装」里执行 members 表的 insert 语句（role 填 <code>admin</code>）。
                </div>
            </div>
        </section>

        <!-- 问卷管理 -->
        <section class="admin-section" id="sec-surveys">
            <div class="card" style="cursor:default;">
                <h3>问卷管理</h3>
                <p>在「问卷小屋」里设计和作答；这里可以总览与删除。</p>
                <div id="surveyAdminList"></div>
            </div>
        </section>

        <!-- 数据备份 -->
        <section class="admin-section" id="sec-data">
            <div class="card" style="cursor:default;">
                <h3>朴实文章 · 导出 / 导入</h3>
                <p>entries 表的全部内容（日记 + 思辨都在里面），导出成 JSON 备份；导入按 id 合并覆盖。</p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;">
                    <button class="btn blue" id="exportBtn">⬇️ 导出全部 entries</button>
                    <button class="btn ghost" id="exportSurveyBtn">⬇️ 导出问卷数据</button>
                    <button class="btn ghost" id="exportPwBtn">⬇️ 导出相册 + 清单</button>
                </div>
                <div class="field"><label>导入 entries JSON<span class="hint">粘贴备份文件内容，按 id 合并</span></label>
                    <textarea class="textarea" id="importArea" style="min-height:150px;" placeholder='[{"id":"d2026-04-06-xxxxx","kind":"journal",...}]'></textarea></div>
                <button class="btn" id="importBtn">⬆️ 导入并合并</button>
            </div>
        </section>

        <!-- 数据库安装 -->
        <section class="admin-section" id="sec-sql">
            <div class="card" style="cursor:default;">
                <h3>数据库安装 SQL</h3>
                <p>在 Supabase 控制台 → SQL Editor 里执行一次即可（可重复执行）。包含：账号表、文章表、问卷三张表、相册与清单表，以及相册的 Storage 公开桶和全部行级安全策略。</p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.8rem;">
                    <button class="btn sm blue" id="copySqlBtn">📋 复制全部 SQL</button>
                </div>
                <pre class="code-block" id="sqlBlock"></pre>
            </div>
        </section>

        <!-- 使用说明 -->
        <section class="admin-section" id="sec-help">
            <div class="card" style="cursor:default;">
                <h3>这套站怎么运转</h3>
                <div class="kv"><span class="k">登录</span><span>整站所有内容都要登录。账号只有两个（你和她），存在 Supabase Authentication；授权名单在 <b>members</b> 表。</span></div>
                <div class="kv"><span class="k">朴实文章</span><span><b>entries</b> 表，kind 字段区分 journal（日常想法）/ philosophy（思辨话题）；「朴实文章」一页合并显示，编辑器里可选类型。</span></div>
                <div class="kv"><span class="k">问卷</span><span><b>surveys</b> + <b>survey_questions</b> + <b>survey_responses</b> 三张表；每人每卷一份答卷，重复提交即覆盖；结果双方互看。</span></div>
                <div class="kv"><span class="k">恋爱相册</span><span><b>photos</b> 表存照片的链接与说明；图片本体上传到 Storage 的公开桶 <b>photos</b>（执行安装 SQL 会自动建桶和策略，也可手动在 Storage 里建）。</span></div>
                <div class="kv"><span class="k">恋爱清单</span><span><b>wishlist</b> 表：约定内容 + 补充说明 + 相关图片 + 完成状态，双方都可增删改。</span></div>
                <div class="kv"><span class="k">问卷文本格式</span><span><code># 标题</code> / <code>&gt; 描述</code> / <code>1. 题干 [单选|多选|文本]</code> / <code>- 选项</code>；「问卷小屋 → 设计问卷 → AI 提示词」里有一键复制的提示词。</span></div>
                <div class="kv"><span class="k">安全</span><span>anon key 本来就是公开的，真正的权限由 RLS（行级安全策略）保证：不是成员，连一行都读不到。</span></div>
            </div>
        </section>
    </template>

    <footer class="page-foot">♥ 记录我们的每一天 ♥</footer>
</main>

<script src="./assets/app-core.js"></script>
<script>
const INSTALL_SQL = SiteApp.INSTALL_SQL;

(async function () {
    const app = await SiteApp.init({ shell: 'lg', main: '#pageMain' });
    if (!app.me) return;
    const main = document.getElementById('pageMain');
    main.innerHTML = '';
    main.appendChild(document.getElementById('pageContent').content.cloneNode(true));

    const esc = SiteApp.esc;
    const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('zh-CN', { hour12: false }); };

    /* ---------- 统计 ---------- */
    try {
        const safe = p => p.catch(() => []);
        const [je, pe, sv, rs, ph, wl] = await Promise.all([
            safe(app.sbRest('entries?kind=eq.journal&select=id')),
            safe(app.sbRest('entries?kind=eq.philosophy&select=id')),
            safe(app.sbRest('surveys?select=id')),
            safe(app.sbRest('survey_responses?select=id')),
            safe(app.sbRest('photos?select=id')),
            safe(app.sbRest('wishlist?select=done'))
        ]);
        const doneN = wl.filter(x => x.done).length;
        const cards = [
            ['📖 朴实文章', (je.length + pe.length) + ' 篇'],
            ['📷 相册', ph.length + ' 张'],
            ['✅ 清单', doneN + ' / ' + wl.length + ' 完成'],
            ['📋 问卷', sv.length + ' 份'],
            ['📨 答卷', rs.length + ' 份']
        ];
        const missing = (je.length + pe.length) === 0 && sv.length === 0 && ph.length === 0 && wl.length === 0;
        document.getElementById('statCards').innerHTML = cards.map(c =>
            '<div class="stat-card"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>').join('') +
            (missing ? '<div class="notice" style="grid-column:1/-1;">看起来各项都还是空的 —— 若是新装的数据库，先去「数据库安装」执行 SQL；否则就真的是一条记录都没有啦。</div>' : '');
    } catch (e) {
        document.getElementById('statCards').innerHTML =
            '<div class="notice" style="grid-column:1/-1;">统计加载失败：' + esc(e.message) + '（可能需要先执行数据库安装 SQL）</div>';
    }

    /* ---------- 账号 ---------- */
    document.getElementById('accountInfo').innerHTML =
        '<div class="kv"><span class="k">邮箱</span><b>' + esc(app.me.email) + '</b></div>' +
        '<div class="kv"><span class="k">称呼</span><b>' + esc(app.me.display_name || '（未设置，可在 members 表里填 display_name）') + '</b></div>' +
        '<div class="kv"><span class="k">权限</span><b>成员（可读可写，和另一个账号完全一样）</b></div>';

    /* ---------- 情侣配置 ---------- */
    const CFG_FIELDS = { site_title: 'cfgTitle', slogan: 'cfgSlogan', name_a: 'cfgNameA', name_b: 'cfgNameB', bg_url: 'cfgBg', since: 'cfgSince' };
    Object.keys(CFG_FIELDS).forEach(k => {
        document.getElementById(CFG_FIELDS[k]).value = app.config[k] || '';
    });
    document.getElementById('avaAPrev').src = app.config.avatar_a || './assets/avatar-a.svg';
    document.getElementById('avaBPrev').src = app.config.avatar_b || './assets/avatar-b.svg';
    document.getElementById('bgPrev').src = app.config.bg_url || '';
    document.getElementById('bgPrev').style.display = app.config.bg_url ? 'block' : 'none';
    const pendingAva = { a: null, b: null };
    document.getElementById('cfgAvaA').addEventListener('change', e => {
        pendingAva.a = e.target.files[0] || null;
        if (pendingAva.a) document.getElementById('avaAPrev').src = URL.createObjectURL(pendingAva.a);
    });
    document.getElementById('cfgAvaB').addEventListener('change', e => {
        pendingAva.b = e.target.files[0] || null;
        if (pendingAva.b) document.getElementById('avaBPrev').src = URL.createObjectURL(pendingAva.b);
    });
    /* 背景：选了本地文件优先用文件，否则用输入框里的链接 */
    let pendingBg = null;
    document.getElementById('cfgBgFile').addEventListener('change', e => {
        pendingBg = e.target.files[0] || null;
        const prev = document.getElementById('bgPrev');
        if (pendingBg) { prev.src = URL.createObjectURL(pendingBg); prev.style.display = 'block'; }
    });
    document.getElementById('cfgBg').addEventListener('input', e => {
        if (pendingBg) return;   // 已选文件时以文件为准
        const prev = document.getElementById('bgPrev');
        prev.src = e.target.value.trim();
        prev.style.display = e.target.value.trim() ? 'block' : 'none';
    });

    async function uploadAva(file, tag, folder) {
        const ext = (file.name.match(/\.\w+$/) || ['.jpg'])[0];
        const path = (folder || 'avatars') + '/' + tag + '-' + Date.now().toString(36) + ext;
        const res = await fetch(SiteApp.sbUrl() + '/storage/v1/object/photos/' + path, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + SiteApp.session().accessToken },
            body: file
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            const msg = data.message || data.error || ('上传失败（' + res.status + '）');
            if (/Bucket not found|does not exist/i.test(msg)) {
                throw new Error('Storage 里还没有公开桶 photos —— 重新执行一遍「数据库安装」里的 SQL 即可自动创建');
            }
            throw new Error(msg);
        }
        return SiteApp.sbUrl() + '/storage/v1/object/public/photos/' + path;
    }

    document.getElementById('cfgSave').addEventListener('click', async () => {
        const msg = document.getElementById('cfgMsg');
        const btn = document.getElementById('cfgSave');
        msg.textContent = '';
        const old = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 保存中…';
        try {
            const patch = {};
            Object.keys(CFG_FIELDS).forEach(k => { patch[k] = document.getElementById(CFG_FIELDS[k]).value.trim(); });
            if (pendingAva.a) patch.avatar_a = await uploadAva(pendingAva.a, 'a');
            if (pendingAva.b) patch.avatar_b = await uploadAva(pendingAva.b, 'b');
            if (pendingBg) patch.bg_url = await uploadAva(pendingBg, 'bg', 'bg');
            const rows = Object.keys(patch).map(k => ({ key: k, value: patch[k] }));
            await app.sbRest('site_config', {
                method: 'POST',
                prefer: 'resolution=merge-duplicates',
                body: rows
            });
            SiteApp.saveConfigLocal(patch);   // 立刻刷新本页顶栏 / 标题 / 背景
            msg.textContent = '✓ 已保存，全站（主厅头像、名字、计时器、站点名、背景）立刻生效';
            SiteApp.toast('情侣配置已保存 💑', 'ok');
        } catch (e) {
            msg.textContent = '❌ ' + e.message;
        } finally {
            btn.disabled = false; btn.innerHTML = old;
        }
    });

    /* ---------- 分区切换 ---------- */
    document.querySelectorAll('#adminNav .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#adminNav .tab-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('on'));
            document.getElementById('sec-' + btn.dataset.sec).classList.add('on');
            if (btn.dataset.sec === 'surveys') renderSurveyAdmin();
        });
    });

    /* ---------- 问卷管理 ---------- */
    async function renderSurveyAdmin() {
        const host = document.getElementById('surveyAdminList');
        try {
            const surveys = (await app.sbRest('surveys?select=*&order=created_at.desc')) || [];
            if (!surveys.length) { host.innerHTML = '<div class="empty-state">还没有问卷。去「问卷小屋」出第一份题。</div>'; return; }
            host.innerHTML = surveys.map(s =>
                '<div class="kv"><span class="k">' + fmtTime(s.created_at) + '</span>' +
                '<b>' + esc(s.title) + '</b>' +
                '<span style="flex:1;"></span>' +
                '<button class="btn sm danger" data-del="' + esc(s.id) + '">🗑 删除</button></div>').join('');
            host.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('确定删除这份问卷？题目和答卷都会一起删除。')) return;
                    try {
                        await app.sbRest('surveys?id=eq.' + encodeURIComponent(btn.dataset.del), { method: 'DELETE' });
                        SiteApp.toast('已删除', 'ok');
                        renderSurveyAdmin();
                    } catch (e) { SiteApp.toast('删除失败：' + e.message, 'err', 4000); }
                });
            });
        } catch (e) {
            host.innerHTML = '<div class="notice">加载失败：' + esc(e.message) + '</div>';
        }
    }

    /* ---------- 导出 / 导入 ---------- */
    function downloadJson(name, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }
    document.getElementById('exportBtn').addEventListener('click', async () => {
        try {
            const rows = await app.sbRest('entries?select=*&order=date.asc');
            downloadJson('entries-backup-' + new Date().toISOString().slice(0, 10) + '.json', rows);
            SiteApp.toast('已导出 ' + rows.length + ' 条 💾', 'ok');
        } catch (e) { SiteApp.toast('导出失败：' + e.message, 'err', 4000); }
    });
    document.getElementById('exportSurveyBtn').addEventListener('click', async () => {
        try {
            const [s, q, r] = await Promise.all([
                app.sbRest('surveys?select=*'),
                app.sbRest('survey_questions?select=*'),
                app.sbRest('survey_responses?select=*')
            ]);
            downloadJson('surveys-backup-' + new Date().toISOString().slice(0, 10) + '.json', { surveys: s, questions: q, responses: r });
            SiteApp.toast('问卷数据已导出 💾', 'ok');
        } catch (e) { SiteApp.toast('导出失败：' + e.message, 'err', 4000); }
    });
    document.getElementById('exportPwBtn').addEventListener('click', async () => {
        try {
            const [ph, wl] = await Promise.all([
                app.sbRest('photos?select=*'),
                app.sbRest('wishlist?select=*')
            ]);
            downloadJson('photos-wishlist-backup-' + new Date().toISOString().slice(0, 10) + '.json', { photos: ph, wishlist: wl });
            SiteApp.toast('相册 + 清单已导出 💾', 'ok');
        } catch (e) { SiteApp.toast('导出失败：' + e.message, 'err', 4000); }
    });
    document.getElementById('importBtn').addEventListener('click', async () => {
        const raw = document.getElementById('importArea').value.trim();
        if (!raw) { SiteApp.toast('先粘贴 JSON 内容', 'err'); return; }
        let rows;
        try { rows = JSON.parse(raw); } catch (e) { SiteApp.toast('JSON 解析失败：' + e.message, 'err', 4000); return; }
        if (!Array.isArray(rows) || !rows.length) { SiteApp.toast('内容要是非空的数组', 'err'); return; }
        if (!confirm('将导入 ' + rows.length + ' 条并按 id 覆盖合并，继续？')) return;
        try {
            await app.sbRest('entries', {
                method: 'POST',
                prefer: 'resolution=merge-duplicates',
                body: rows.map(r => ({
                    id: r.id, kind: r.kind, date: r.date,
                    mood: r.mood || '', title: r.title || '', content: r.content || '',
                    created_at: r.created_at || new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }))
            });
            SiteApp.toast('导入完成 ✨', 'ok');
            document.getElementById('importArea').value = '';
        } catch (e) { SiteApp.toast('导入失败：' + e.message, 'err', 4200); }
    });

    /* ---------- SQL ---------- */
    document.getElementById('sqlBlock').textContent = INSTALL_SQL;
    document.getElementById('copySqlBtn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(INSTALL_SQL);
            SiteApp.toast('SQL 已复制，去 Supabase SQL Editor 执行 🛠', 'ok');
        } catch (e) { SiteApp.toast('复制失败，请手动全选复制', 'err'); }
    });
})();
</script>
</body>
</html>
