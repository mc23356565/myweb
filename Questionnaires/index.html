<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>问卷小屋 · 你问我答</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../Style/css/content.css">
    <link rel="stylesheet" href="../Style/css/index.css">
    <link rel="stylesheet" href="../Style/css/animate.min.css">
    <link rel="stylesheet" href="../Style/css/ops.css">
</head>
<body data-page="survey">
<main class="central">
    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="pageContent">
        <div class="section-head">📝 问卷小屋 · 你问我答</div>
        <p class="section-sub">出一套题考考对方，或者认真答完她出的卷子 —— 每道题的答案，两个人都能互相查看。</p>
        <div id="viewHost">
            <div class="empty-state"><span class="spin" style="color:var(--blue-2)"></span> 正在加载问卷数据…</div>
        </div>
    </template>

    <footer class="page-foot">⚬ 答案会被温柔保管 · 只给你们两个人看 ⚬</footer>
</main>

<script src="../assets/app-core.js"></script>
<script src="../assets/questionnaire.js"></script>
<script>
(async function () {
    const app = await SiteApp.init({ shell: 'lg', main: '#pageMain' });
    if (!app.me) return;
    const main = document.getElementById('pageMain');
    main.innerHTML = '';
    main.appendChild(document.getElementById('pageContent').content.cloneNode(true));
    QuestionnaireApp.start(app);
})();
</script>
</body>
</html>
