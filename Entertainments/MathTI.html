<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MatHTI · 数学人格测试 | 抽象整活版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'SF Pro Text', 'Inter', 'PingFang SC', Roboto, monospace;
        }
        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #eef2f5 100%);
            padding: 2rem 1rem;
            color: #0f172a;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.25);
            padding: 1.5rem 1.8rem 2.2rem;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px dashed #fde047;
            padding-bottom: 1.2rem;
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #b45309, #eab308, #2b7a4b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }
        .hero .tagline {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b, #334155);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .hero .sub {
            font-size: 1rem;
            color: #475569;
            background: #fef9e6;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            margin-top: 0.8rem;
        }
        .dim-badge {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 1rem 0 0.5rem;
            font-size: 0.7rem;
        }
        .dim-badge span {
            background: #e9ecef;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-weight: 500;
        }
        .stats {
            background: #f1f5f9;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.2rem 0 1.5rem;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .answered-count {
            background: #f59e0b;
            color: white;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
        }
        .back {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .back:hover {
            background: #e2e8f0;
        }
        .reset-all {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-all:hover {
            background: #e2e8f0;
        }
        .questions-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .question-item {
            background: white;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            border: 1px solid #eef2ff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .q-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #f59e0b;
            background: #fef9e6;
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
        }
        .q-text {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0.5rem 0 0.8rem;
        }
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.3rem;
        }
        .opt-btn {
            flex: 1;
            min-width: 130px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 60px;
            padding: 0.5rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            color: #1e293b;
        }
        .opt-btn.selected {
            background: #f59e0b;
            border-color: #f59e0b;
            color: white;
            box-shadow: 0 2px 6px rgba(245,158,11,0.3);
        }
        .action-btn {
            display: flex;
            gap: 1rem;
            margin: 1rem 0 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            background: #1e293b;
            border: none;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            min-width: 120px;
        }
        .btn-secondary {
            background: #475569;
        }
        .btn-reset {
            background: #9c1f1f;
        }
        .btn:hover {
            background: #f59e0b;
            transform: translateY(-2px);
        }
        .result-card {
            background: #fef9e3;
            border-radius: 1.8rem;
            padding: 1.5rem;
            text-align: center;
            margin-top: 1rem;
            border: 1px solid #fde68a;
        }
        .result-type {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 4px;
            background: #0f172a;
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            color: #fbbf24;
            margin: 0.5rem 0;
        }
        .result-desc {
            font-size: 0.95rem;
            color: #2d3e50;
            margin-top: 0.5rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
            text-align: left;
            background: #fff7e0;
            padding: 1rem;
            border-radius: 1.2rem;
        }
        .radar-container {
            max-width: 400px;
            margin: 1.5rem auto 0.5rem;
            position: relative;
        }
        canvas {
            width: 100%;
            height: auto;
            background: rgba(255,255,240,0.6);
            border-radius: 1rem;
            padding: 0.5rem;
        }
        hr {
            margin: 0.8rem 0;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1.8rem;
            color: #6c757d;
        }
        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .options-row { flex-direction: column; }
            .opt-btn { min-width: auto; }
            .hero .tagline { font-size: 1.5rem; }
            .action-btn { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>🧠 MBTI早就过时了</h1>
        <div class="tagline">🔥 快来测测你的 MatHTI 🔥</div>
        <div class="sub">数学人格暴论 · 复合维度影响 · 开启你的数学人生</div>
        <div class="dim-badge">
            <span>🧮 计算(C) ⇄ 证明(L)</span>
            <span>📐 几何(G) ⇄ 代数(A)</span>
            <span>🎯 结果(R) ⇄ 过程(P)</span>
            <span>✨ 直觉(N) ⇄ 严谨(D)</span>
        </div>
    </div>

    <div class="stats">
        <span>📋 30道灵魂拷问（题目&选项全随机）</span>
        <span>✅ 已选 <span id="answeredCounter">0</span> / 30</span>
        <span class="reset-all" id="clearAnswersBtn">🗑️ 清空当前答案</span>
		<span class="back" onclick="goBackToSecret()">🏠 重返主站</span>
    </div>

    <div id="questionsContainer" class="questions-grid"></div>

    <div class="action-btn">
        <button class="btn" id="submitBtn">✨ 生成我的 MatHTI 人格 ✨</button>
        <button class="btn btn-secondary" id="scrollTopBtn">📜 回到顶部</button>
        <button class="btn btn-reset" id="retakeBtn">🔄 再测一次（全新乱序）</button>
    </div>

    <div id="resultArea" style="display: none;">
        <div class="result-card">
            <div>🧬 你的数学人格代码</div>
            <div class="result-type" id="resultType">----</div>
            <div class="result-desc" id="resultDesc"></div>
            <div class="radar-container">
                <canvas id="radarChart" width="400" height="400"></canvas>
            </div>
            <hr>
            <div style="font-size:0.8rem;">⚠️ 纯抽象整活，摆烂率超过40%会触发隐藏结局</div>
        </div>
    </div>
    <footer>MatHTI = Mathematics Hell Type Indicator · 再测一次会重置所有题目顺序</footer>
</div>

<script>
    // ======================= 题库 =======================

    // 每个选项增加 isTilt 标记是否为摆烂选项
    const rawQuestionBank = [
        { dim:0, text: "面对一道积分题，你内心真实想法是？", 
          opts: [
              { label: "🔢 无脑算！秒了，答案就是它", deltas: [-2, 0, -1, 0], isTilt: false },

        { dim:0, text: "解方程时，你的舒适区是？",

        { dim:1, text: "几何与代数，你天然倾向？",

              { label: "⚖️ 一半时间凑答案，一半写过程", deltas: [0, 0, -1, 0], isTilt: false },

    // 随机打乱数组
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 生成全新乱序题目（题目乱序 + 每个题目内选项乱序）
    function generateShuffledQuestions() {
        const shuffledQuestions = shuffleArray([...rawQuestionBank]);
        return shuffledQuestions.map(q => ({
            ...q,
            opts: shuffleArray([...q.opts])
        }));
    }

    let questions = generateShuffledQuestions();
    // 存储每个题目的选中信息: { deltas, isTilt }
    let answers = new Array(30).fill(null);
    let radarChart = null;

    const container = document.getElementById('questionsContainer');

    function renderQuestions() {
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const selected = answers[idx];
            const qDiv = document.createElement('div');
            qDiv.className = 'question-item';
            const dimName = getDimName(q.dim);
            qDiv.innerHTML = `
                <div class="q-title">维度已隐藏</div>
                <div class="q-text">${idx+1}. ${q.text}</div>
                <div class="options-row" data-qidx="${idx}">
                    ${q.opts.map((opt, optIdx) => {
                        const isSelected = selected && selected.deltas === opt.deltas;
                        return `<div class="opt-btn ${isSelected ? 'selected' : ''}" data-deltas='${JSON.stringify(opt.deltas)}' data-istilt='${opt.isTilt}'>${opt.label}</div>`;
                    }).join('')}
                </div>
            `;
            container.appendChild(qDiv);
        });
        attachClickEvents();
        updateCounter();
    }

    function getDimName(dim) {
        const map = {0:'⚖️ 计算/证明',1:'📐 几何/代数',2:'🎯 结果/过程',3:'✨ 直觉/严谨'};
        return map[dim];
    }

    function attachClickEvents() {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(btn => {
            btn.removeEventListener('click', optClickHandler);
            btn.addEventListener('click', optClickHandler);
        });
    }

    function optClickHandler(e) {
        const btn = e.currentTarget;
        const deltasStr = btn.getAttribute('data-deltas');
        const deltas = JSON.parse(deltasStr);
        const isTilt = btn.getAttribute('data-istilt') === 'true';
        const parentRow = btn.closest('.options-row');
        const qIdx = parseInt(parentRow.getAttribute('data-qidx'));
        if (isNaN(qIdx)) return;
        answers[qIdx] = { deltas, isTilt };
        const allBtns = parentRow.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateCounter();
    }

    function updateCounter() {
        const answered = answers.filter(a => a !== null).length;
        document.getElementById('answeredCounter').innerText = answered;
    }

    function clearAnswersOnly() {
        for (let i = 0; i < answers.length; i++) answers[i] = null;
        renderQuestions();
        document.getElementById('resultArea').style.display = 'none';
        if (radarChart) { radarChart.destroy(); radarChart = null; }
    }

    function fullRetake() {
        questions = generateShuffledQuestions();
        answers = new Array(30).fill(null);
        renderQuestions();
        document.getElementById('resultArea').style.display = 'none';
        if (radarChart) { radarChart.destroy(); radarChart = null; }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function computeDimensionScores() {
        let dimScores = [0, 0, 0, 0];
        for (let i = 0; i < answers.length; i++) {
            const item = answers[i];
            if (!item) continue;
            const deltas = item.deltas;
            for (let d = 0; d < 4; d++) {
                dimScores[d] += deltas[d];
            }
        }
        return dimScores;
    }

    function getPersonalityType(scores) {
        let type = '';
        type += scores[0] < 0 ? 'C' : (scores[0] > 0 ? 'L' : 'C');
        type += scores[1] < 0 ? 'G' : (scores[1] > 0 ? 'A' : 'G');
        type += scores[2] < 0 ? 'R' : (scores[2] > 0 ? 'P' : 'R');
        type += scores[3] < 0 ? 'N' : (scores[3] > 0 ? 'D' : 'N');
        return type;
    }

    // 计算摆烂比例并判断是否触发摆烂结局
    function getTiltRatio() {
        let tiltCount = 0;
        let totalAnswered = 0;
        for (let i = 0; i < answers.length; i++) {
            const item = answers[i];
            if (item) {
                totalAnswered++;
                if (item.isTilt) tiltCount++;
            }
        }
        // 只考虑已答题目，但正常情况全答完才提交，所以totalAnswered=30
        const ratio = totalAnswered === 0 ? 0 : tiltCount / totalAnswered;
        return { tiltCount, totalAnswered, ratio };
    }

            'LAPD': '📖 **证明-代数-过程-严谨 (希尔伯特门徒)**\n你写证明时会先列公理，再推引理，最后证定理，格式堪比《几何原本》。你的数学笔记可以影印出版，但你自己经常陷入“过度严谨导致写不完”的困境。(冷知识: 你的数学人格和空曙一样)'
        };
        return map[type] || '🧬 **薛定谔型人格**\n你介于严谨与直觉之间，没人能预测你的数学行为。可能是天才，也可能是民科，建议再测一次。';
    }

    function drawRadar(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (radarChart) radarChart.destroy();
        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['计算倾向 (负C/正L)', '几何倾向 (负G/正A)', '结果倾向 (负R/正P)', '直觉倾向 (负N/正D)'],
                datasets: [{
                    label: '你的维度净得分',
                    data: scores,
                    backgroundColor: 'rgba(245, 158, 11, 0.2)',
                    borderColor: '#f59e0b',
                    borderWidth: 2,
                    pointBackgroundColor: '#f59e0b',
                    pointBorderColor: '#fff',
                    pointRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    r: {
                        beginAtZero: false,
                        ticks: { stepSize: 5, backdropColor: 'transparent' },
                        title: { display: true, text: '净得分 (负→左倾向，正→右倾向)' }
                    }
                },
                plugins: {
                    tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw.toFixed(2)}` } }
                }
            }
        });
    }
	
    function goBackToSecret() {
        window.location.href = "../Selects/FunProjects.html";
    }

    function submitAndShow() {
        const answeredCount = answers.filter(a => a !== null).length;
        if (answeredCount < 30) {
            alert(`还差 ${30 - answeredCount} 道题没选！快把你的数学灵魂填满再测～ 摆烂也要选完啊！`);
            return;
        }
        const scores = computeDimensionScores();
        const { ratio, tiltCount } = getTiltRatio();
        const isTiltEnding = ratio >= 0.4; // 摆烂选项占比 >= 40%
        
        let displayType = '';
        let desc = '';
        if (isTiltEnding) {
            displayType = '💀 摆烂之王 💀';
            desc = getTiltEndingDescription(ratio);
        } else {
            const type = getPersonalityType(scores);
            displayType = type;
            desc = getDescription(type, false);
        }
        
        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        document.getElementById('resultType').innerHTML = displayType;
        document.getElementById('resultDesc').innerHTML = `<strong>${isTiltEnding ? '隐藏结局' : displayType + ' · 人格解析'}</strong><br><br>${desc.replace(/\n/g,'<br>')}`;
        drawRadar(scores);
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('submitBtn').addEventListener('click', submitAndShow);
    document.getElementById('clearAnswersBtn').addEventListener('click', clearAnswersOnly);
    document.getElementById('retakeBtn').addEventListener('click', fullRetake);
    document.getElementById('scrollTopBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    renderQuestions();
</script>
</body>
</html>
