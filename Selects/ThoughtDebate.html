<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>个性思辨 · 分类选择 | 空曙</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="thought">
<main class="central">
    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="pageContent">
        <div class="section-head">🧠 个性思辨 · 选择路径</div>
        <p class="section-sub" style="text-align:center;">两条脉络，记录思维的两种温度</p>
        <div class="card-grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
            <div class="card clickable" data-link="../Thoughts/ThoughtDebatePhilosophy.html">
                <div class="card-icon">⚖️🧠</div>
                <h2>思辨话题</h2>
                <p>深度哲思、价值辩论、抽象命题与逻辑森林。存放那些需要反复推敲的思绪。</p>
                <button class="btn sm ghost" type="button">进入思辨辑录 →</button>
            </div>
            <div class="card clickable" data-link="../Thoughts/ThoughtDebateDaily.html">
                <div class="card-icon">📖🌿</div>
                <h2>日常想法</h2>
                <p>碎碎念、生活观察、情绪切片。很无聊的日常，不过以一种新的方式记录罢了。</p>
                <button class="btn sm ghost" type="button">进入日常手帖 →</button>
            </div>
        </div>
        <footer class="page-foot">⚬ 生命绚烂，别被黑暗压垮... ⚬</footer>
    </template>
</main>

<script src="../assets/app-core.js"></script>
<script>
(async function () {
    const app = await SiteApp.init({ active: 'thought', main: '#pageMain' });
    if (!app.me) return;
    const main = document.getElementById('pageMain');
    main.innerHTML = '';
    main.appendChild(document.getElementById('pageContent').content.cloneNode(true));
    main.querySelectorAll('.card[data-link]').forEach(card => {
        card.addEventListener('click', () => location.href = card.dataset.link);
    });
})();
</script>
</body>
</html>
