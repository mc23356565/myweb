<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>生辰纪念 · 年轮回响 | 空曙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #e7dfd1;
            background-image: radial-gradient(circle at 10% 20%, rgba(200, 180, 150, 0.1) 2%, transparent 2.5%),
                              radial-gradient(circle at 85% 65%, rgba(160, 130, 95, 0.08) 1.5%, transparent 2%);
            background-size: 32px 32px, 28px 28px;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* 主容器 */
        .archive-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 导航栏 + 返回主菜单 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid #d6c5ae;
            padding-bottom: 1rem;
        }
        .back-home {
            background: #a78763;
            border: none;
            color: #fef6e8;
            padding: 0.55rem 1.4rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-family: inherit;
        }
        .back-home:hover {
            background: #826a48;
            transform: translateY(-2px);
        }
        .page-title {
            font-size: 2rem;
            font-weight: 600;
            color: #4e3622;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title span {
            background: #dccfba;
            padding: 0.2rem 0.9rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: normal;
            color: #5b3f26;
        }

        /* 年份卡片网格 — 可扩展 */
        .years-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin: 2rem 0 2.5rem;
        }

        .birth-card {
            background: #fffbf2;
            border-radius: 2rem;
            transition: all 0.25s ease;
            box-shadow: 0 12px 22px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid #eddbbc;
            overflow: hidden;
            cursor: pointer;
        }
        .birth-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 28px -12px rgba(70, 45, 20, 0.25);
            background: #ffffff;
            border-color: #c6a97c;
        }
        .card-banner {
            height: 120px;
            background: linear-gradient(130deg, #dcc194, #b8946c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
        }
        .card-content {
            padding: 1.6rem 1.5rem 1.8rem;
        }
        .birth-year {
            font-size: 1.9rem;
            font-weight: 700;
            color: #4f351f;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }
        .birth-sub {
            color: #9f8464;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .desc {
            color: #5e4a33;
            line-height: 1.5;
            font-size: 0.9rem;
            margin: 0.6rem 0 1.2rem;
        }
        .enter-archive {
            background: #ba9572;
            border: none;
            color: white;
            padding: 0.5rem 1.4rem;
            border-radius: 3rem;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .enter-archive:hover {
            background: #9a744f;
        }

        /* 可扩展提示条 */
        .expand-hint {
            text-align: center;
            margin-top: 2rem;
            background: #f3ecdf;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            color: #9e7d59;
            font-size: 0.8rem;
            border: 1px dashed #cfb38c;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #b19674;
        }
        @media (max-width: 680px) {
            body { padding: 1.2rem; }
            .page-title { font-size: 1.6rem; }
            .birth-year { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="archive-container">
    <div class="top-bar">
        <div class="page-title">
            🎂 生辰纪念 · 年轮回廊
        </div>
        <button class="back-home" id="backToMainBtn">🏠 返回主厅 · 记忆回廊</button>
    </div>
    <p style="margin-bottom: 1rem; color: #846e50; font-size: 0.9rem; border-left: 3px solid #c2a075; padding-left: 1rem;">
        ✦ 每一道年轮都是一座记忆密室，轻触卡片，重返那一年的独白时刻 ✦
    </p>

    <!-- 年份卡片动态生成区域 -->
    <div class="years-grid" id="birthdayYearsContainer"></div>

    <footer>⚬ 不过是一些往昔的记忆，而已... ⚬</footer>
</div>

<script>
    const BIRTHDAY_RECORDS = [
        {
            id: "20th",
            yearLabel: "沉寂 · 二十岁",
            bannerIcon: "🎂✨",
            subText: "2026 · 孤寂之年",
            description: "最煎熬的那年，历经磨难，无边的内耗与绝望，在此刻写下了一封漫长的内心书信...这里似乎还有一些，尚未发现的秘密",
            pageUrl: "../Birthdays/20th.html"
        },
    ];

    // 渲染卡片列表
    function renderYearCards() {
        const container = document.getElementById('birthdayYearsContainer');
        if (!container) return;
        container.innerHTML = '';

        if (BIRTHDAY_RECORDS.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; background:#fef2e4; border-radius:2rem;">✨ 暂无生辰档案，等待时光填充 ✨</div>`;
            return;
        }

        BIRTHDAY_RECORDS.forEach(record => {
            const card = document.createElement('div');
            card.className = 'birth-card';
            // 点击卡片跳转（注意排除按钮事件）
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('.enter-archive')) return;
                if (record.pageUrl) {
                    window.location.href = record.pageUrl;
                } else {
                    console.warn('该纪念页尚未配置路径', record);
                }
            });

            card.innerHTML = `
                <div class="card-banner">${record.bannerIcon || '🎂'}</div>
                <div class="card-content">
                    <div class="birth-year">${record.yearLabel}</div>
                    <div class="birth-sub"><span>📅</span> ${record.subText || ''}</div>
                    <div class="desc">${record.description || '点击探寻这段生日的私语与记忆碎片。'}</div>
                    <button class="enter-archive" data-url="${record.pageUrl}">打开时光胶囊 🗝️</button>
                </div>
            `;
            const enterBtn = card.querySelector('.enter-archive');
            if (enterBtn) {
                enterBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = enterBtn.getAttribute('data-url');
                    if (url) window.location.href = url;
                });
            }
            container.appendChild(card);
        });
    }

    // 返回主菜单 (Secret.html)
    function goBackToSecret() {
        // 根据目录层级: BirthdayArchive.html 和 Secret.html 位于同一级 (主菜单页面)
        window.location.href = "../Secret.html";
    }

    // 绑定返回按钮事件
    document.addEventListener('DOMContentLoaded', () => {
        renderYearCards();
        const backBtn = document.getElementById('backToMainBtn');
        if (backBtn) backBtn.addEventListener('click', goBackToSecret);
    });
</script>
</body>
</html>
