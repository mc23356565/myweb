<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>趣味整活 · 灵感实验室 | 空曙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #ece3d7;
            background-image: radial-gradient(circle at 15% 30%, rgba(190, 160, 120, 0.08) 2%, transparent 2.5%);
            background-size: 28px 28px;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            border-bottom: 2px solid #d4c0a4;
            padding-bottom: 1rem;
        }
        .page-title {
            font-size: 2rem;
            font-weight: 600;
            color: #4a351f;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title span {
            background: #dac9b2;
            padding: 0.2rem 0.9rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: normal;
            color: #5b3f26;
        }
        .back-home {
            background: #9f8362;
            border: none;
            color: #fef5e8;
            padding: 0.55rem 1.4rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-home:hover {
            background: #7c6243;
            transform: translateY(-2px);
        }

        /* 项目网格 — 可扩展卡片 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 2rem;
            margin: 2rem 0 2rem;
        }
        .project-card {
            background: #fffbf2;
            border-radius: 1.8rem;
            border: 1px solid #ecdbbc;
            transition: all 0.25s;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-6px);
            background: #ffffff;
            border-color: #c2a172;
            box-shadow: 0 18px 28px -12px rgba(70,45,20,0.2);
        }
        .card-header {
            background: linear-gradient(120deg, #e6d5bd, #d7c2a2);
            padding: 1.2rem;
            font-size: 2.2rem;
            text-align: center;
        }
        .card-body {
            padding: 1.5rem 1.5rem 1.8rem;
        }
        .project-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4a311c;
            margin-bottom: 0.4rem;
        }
        .project-desc {
            color: #7a6244;
            line-height: 1.5;
            font-size: 0.9rem;
            margin: 0.7rem 0 1.2rem;
        }
        .launch-btn {
            background: #b2885c;
            border: none;
            color: white;
            padding: 0.45rem 1.3rem;
            border-radius: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .launch-btn:hover {
            background: #8c643f;
        }
        .expand-hint {
            text-align: center;
            margin-top: 2rem;
            background: #f3ecdf;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            color: #9e7d59;
            font-size: 0.8rem;
            border: 1px dashed #cfb38c;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #b19674;
        }
        @media (max-width: 650px) {
            .project-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="page-title">
            🎮 趣味整活 · 脑洞工坊
        </div>
        <button class="back-home" id="backToMainBtn">🏠 返回主厅 · 记忆回廊</button>
    </div>
    <p style="margin-bottom: 0.5rem; color: #7c6446; border-left: 3px solid #c2a075; padding-left: 1rem;">
        ⚡ 每一次整活都是灵感的野蛮生长，后续会不断增加奇怪又迷人的小东西。
    </p>

    <div class="projects-grid" id="funProjectsContainer"></div>

    <footer>⚬ 空怀逸性思...曙色映新途 ⚬</footer>
</div>

<script>
    const FUN_PROJECTS = [
        {
            id: "mathTI",
            title: "MathTI",
            icon: "🧮✨",
            description: "抽象但有趣的数学人格测试，我不允许你不知道你自己的数学人格！",
            link: "../Entertainments/MathTI.html"
        },
    ];

    function renderProjects() {
        const container = document.getElementById('funProjectsContainer');
        if (!container) return;
        container.innerHTML = '';

        if (FUN_PROJECTS.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; background:#fef2e4; border-radius:2rem;">✨ 暂无整活项目，新的脑洞正在孵化 ✨</div>`;
            return;
        }

        FUN_PROJECTS.forEach(proj => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('.launch-btn')) return;
                if (proj.link) window.location.href = proj.link;
            });

            card.innerHTML = `
                <div class="card-header">${proj.icon || '🎲'}</div>
                <div class="card-body">
                    <div class="project-title">${proj.title}</div>
                    <div class="project-desc">${proj.description}</div>
                    <button class="launch-btn" data-url="${proj.link}">🔗 前往体验</button>
                </div>
            `;
            const btn = card.querySelector('.launch-btn');
            if (btn) {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (proj.link) window.location.href = proj.link;
                });
            }
            container.appendChild(card);
        });
    }

    function goBackToSecret() {
        window.location.href = "../Secret.html";
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderProjects();
        const backBtn = document.getElementById('backToMainBtn');
        if (backBtn) backBtn.addEventListener('click', goBackToSecret);
    });
</script>
</body>
</html>
