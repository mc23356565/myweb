<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>趣味整活 · 灵感实验室 | 空曙</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="fun">
<main class="central">
    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="pageContent">
        <div class="section-head">🎮 趣味整活 · 脑洞工坊</div>
        <p class="section-sub">⚡ 每一次整活都是灵感的野蛮生长，后续会不断增加奇怪又迷人的小东西。</p>
        <div class="card-grid" id="funProjectsContainer"></div>
        <div class="empty-state" id="funEmptyState" hidden>✨ 暂无整活项目，新的脑洞正在孵化 ✨</div>
        <footer class="page-foot">⚬ 空怀逸兴思...曙色映新途 ⚬</footer>
    </template>
</main>

<script src="../assets/app-core.js"></script>
<script>
/* MathTI 数学人格测试已按计划移除；新的整活项目加回 FUN_PROJECTS 即可自动渲染 */
const FUN_PROJECTS = [];

(async function () {
    const app = await SiteApp.init({ active: 'fun', main: '#pageMain' });
    if (!app.me) return;
    const main = document.getElementById('pageMain');
    main.innerHTML = '';
    main.appendChild(document.getElementById('pageContent').content.cloneNode(true));

    const container = document.getElementById('funProjectsContainer');
    if (!FUN_PROJECTS.length) {
        document.getElementById('funEmptyState').hidden = false;
        return;
    }
    document.getElementById('funEmptyState').hidden = true;
    FUN_PROJECTS.forEach(proj => {
        const card = document.createElement('div');
        card.className = 'card clickable';
        card.style.padding = '0';
        card.style.overflow = 'hidden';
        card.innerHTML =
            '<div style="background:linear-gradient(120deg,#dceeff,#c9e4ff);padding:1.2rem;font-size:2.1rem;text-align:center;">' + (proj.icon || '🎲') + '</div>' +
            '<div style="padding:1.4rem 1.5rem 1.6rem;">' +
                '<div style="font-size:1.4rem;font-weight:700;">' + proj.title + '</div>' +
                '<div style="color:var(--ink-2);line-height:1.75;font-size:.9rem;margin:.5rem 0 1.1rem;">' + proj.description + '</div>' +
                '<button class="btn sm blue">🔗 前往体验</button>' +
            '</div>';
        card.addEventListener('click', () => { if (proj.link) location.href = proj.link; });
        container.appendChild(card);
    });
})();
</script>
</body>
</html>
