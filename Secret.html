<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>空曙 · 记忆回廊 | 主厅</title>
<meta name="description" content="空曙的记忆回廊：生辰纪念、趣味整活、个性思辨，以及藏在角落里的赛博日记。">
<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* ==========================================================================
   空曙 · 记忆回廊（主厅） v2
   保持原有的暖色纸页基调，重排了栅格与留白，并新增「日记速览」。
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

:root {
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-serif: Georgia, "Songti SC", "Noto Serif SC", "SimSun", serif;

    --bg1: #f5ecdd;
    --bg2: #e2d2b9;
    --glow1: rgba(255, 255, 255, .60);
    --glow2: rgba(255, 246, 228, .55);

    --surface: #fffaf2;
    --surface-2: #fdf4e7;
    --surface-3: #f7ecdb;
    --ink: #40301d;
    --ink-2: #6b563b;
    --ink-3: #9b8465;
    --line: #e7d5b8;
    --line-2: #d5bd99;

    --accent: #b1793f;
    --accent-2: #8d5d2f;
    --radius: 22px;
    --shadow: 0 20px 44px -26px rgba(76, 49, 21, .5);
    --shadow-sm: 0 10px 22px -16px rgba(76, 49, 21, .45);
}

html[data-theme="night"] {
    --bg1: #1a1613;
    --bg2: #0f0c0a;
    --glow1: rgba(120, 96, 66, .18);
    --glow2: rgba(90, 70, 45, .16);
    --surface: #221d18;
    --surface-2: #292219;
    --surface-3: #2f2822;
    --ink: #f2e6d3;
    --ink-2: #c6b49b;
    --ink-3: #8d7c66;
    --line: #3a3128;
    --line-2: #4c4034;
    --accent: #d9a869;
    --accent-2: #efc78f;
    --shadow: 0 22px 46px -28px rgba(0, 0, 0, .85);
    --shadow-sm: 0 12px 24px -18px rgba(0, 0, 0, .8);
}

body {
    margin: 0; min-height: 100vh;
    font-family: var(--font-sans); color: var(--ink);
    background:
        radial-gradient(1100px 640px at 10% -10%, var(--glow1), transparent 62%),
        radial-gradient(900px 560px at 100% -4%, var(--glow2), transparent 58%),
        linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    padding: 0 0 40px;
    -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ---------- 顶栏 ---------- */
.topbar {
    position: sticky; top: 0; z-index: 50; margin-bottom: 8px;
    backdrop-filter: blur(14px) saturate(1.2);
    background: rgba(255, 250, 242, .82);
    border-bottom: 1px solid var(--line);
}
html[data-theme="night"] .topbar { background: rgba(34, 29, 24, .86); }
.topbar-inner { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--ink); text-decoration: none; }
.brand-sub { font-weight: 400; font-size: .74rem; color: var(--ink-3); border-left: 1px solid var(--line-2); padding-left: 10px; }
.topbar-spacer { flex: 1 1 auto; }

.btn {
    font-family: inherit; font-size: .84rem; font-weight: 500; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 15px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
}
.btn:hover { background: var(--surface-3); color: var(--ink); transform: translateY(-1px); }
.btn.icon { padding: 8px 11px; }
.btn.primary {
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    color: #fff8ec; border-color: transparent;
    box-shadow: 0 10px 20px -12px rgba(120, 78, 35, .8);
}
.btn.primary:hover { color: #fff; filter: brightness(1.05); }
.btn[disabled] { opacity: .6; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 头部 ---------- */
.hero { text-align: center; padding: 46px 0 26px; }
.hero h1 {
    margin: 0; font-family: var(--font-serif); font-weight: 700; letter-spacing: .6px;
    font-size: clamp(2rem, 5.4vw, 3rem); color: var(--ink);
}
.hero p { margin: 14px auto 0; max-width: 620px; color: var(--ink-3); font-size: .94rem; line-height: 1.8; }
.hero .rule { width: 80px; height: 2px; margin: 22px auto 0; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--line-2), transparent); }

/* ---------- 日记速览 ---------- */
.diary-strip {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 18px 22px; margin: 6px 0 34px;
}
.diary-strip .ds-icon { font-size: 2rem; line-height: 1; }
.diary-strip .ds-main { flex: 1 1 320px; min-width: 240px; }
.diary-strip .ds-title { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.diary-strip .ds-title .pill {
    font-size: .7rem; font-weight: 500; color: var(--accent-2);
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
}
.diary-strip .ds-desc { color: var(--ink-3); font-size: .85rem; line-height: 1.7; margin-top: 6px; }
.diary-strip .ds-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
.diary-strip .ds-stat { font-size: .78rem; color: var(--ink-3); }
.diary-strip .ds-stat b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.diary-strip .ds-moods { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mood-pill {
    font-size: .72rem; color: var(--ink-2); background: var(--surface-3);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
}

/* ---------- 栏目网格 ---------- */
.section-head { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700; color: var(--ink-2); }
.section-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }

.portals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; margin-bottom: 40px; }
.portal-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.portal-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--line-2); }
.card-inner { padding: 22px 22px 20px; display: flex; flex-direction: column; flex: 1; }
.card-icon {
    font-size: 2rem; margin-bottom: 12px; width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center; background: var(--surface-3); border: 1px solid var(--line);
}
.portal-card h2 { font-size: 1.32rem; margin: 0 0 8px; color: var(--ink); font-weight: 600; letter-spacing: .2px; }
.portal-card p { margin: 0 0 18px; color: var(--ink-3); font-size: .88rem; line-height: 1.75; flex: 1; }
.enter-btn {
    align-self: flex-start; background: var(--surface-2); color: var(--accent-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    font-family: inherit; font-size: .84rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .18s;
}
.portal-card:hover .enter-btn { background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: #fff8ec; border-color: transparent; }

/* ---------- 邮件卡片 ---------- */
.mail-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 24px 24px 22px; margin-bottom: 22px;
}
.mail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; font-size: 1.3rem; font-weight: 600; color: var(--ink); }
.mail-header span { font-size: .74rem; font-weight: 400; background: var(--surface-3); border: 1px solid var(--line); padding: 3px 11px; border-radius: 999px; color: var(--ink-3); }
.mail-tip { color: var(--ink-3); font-size: .82rem; line-height: 1.7; margin: 0 0 18px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-weight: 600; font-size: .8rem; color: var(--ink-2); margin-bottom: 6px; }
.form-row input, .form-row textarea {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px;
    font-family: inherit; font-size: .9rem; background: var(--surface-2); color: var(--ink);
    outline: none; transition: border-color .16s, box-shadow .16s; resize: vertical;
}
.form-row input:focus, .form-row textarea:focus {
    border-color: var(--line-2); box-shadow: 0 0 0 3px rgba(177, 121, 63, .18);
}
.optional { font-size: .72rem; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.send-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.send-hint { font-size: .76rem; color: var(--ink-3); }

/* ---------- 提示 / 页脚 ---------- */
.extension-note {
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    width: fit-content; margin: 6px auto 0; padding: 9px 20px; border-radius: 999px;
    background: var(--surface); border: 1px dashed var(--line-2); color: var(--ink-3); font-size: .8rem;
}
footer.page-foot { text-align: center; margin-top: 26px; font-size: .75rem; color: var(--ink-3); }

.toast-host { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
    background: rgba(52, 38, 22, .94); color: #fdf6e9; border-radius: 999px;
    padding: 10px 22px; font-size: .84rem; max-width: 90vw; text-align: center;
    box-shadow: 0 16px 30px -16px rgba(0, 0, 0, .6); animation: toastIn .22s ease;
}
.toast.err { background: rgba(160, 62, 40, .96); color: #fff; }
.toast.ok { background: rgba(48, 110, 84, .96); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

@media (max-width: 720px) {
    .hero { padding: 30px 0 18px; }
    .brand-sub { display: none; }
    .diary-strip { padding: 16px 18px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="wrap topbar-inner">
        <a class="brand" href="./Secret.html">
            <span>📜</span><span>记忆回廊</span>
            <span class="brand-sub">空曙的私人档案室</span>
        </a>
        <div class="topbar-spacer"></div>
        <button class="btn icon" id="themeBtn" title="切换夜读模式">🌙</button>
        <a class="btn" href="#contact">✉️ 寄信给空曙</a>
    </div>
</header>

<main class="wrap">
    <section class="hero">
        <h1>📜 空曙 · 记忆回廊</h1>
        <p>被时光封存的低语 · 每一个选择都会开启一段全新体验</p>
        <div class="rule"></div>
    </section>

    <!-- 日记速览（数据来自 data/journal.js） -->
    <section class="diary-strip" id="diaryStrip" hidden>
        <div class="ds-icon">📓</div>
        <div class="ds-main">
            <div class="ds-title">日常想法 · 浮光掠影 <span class="pill">赛博日记</span></div>
            <div class="ds-desc">碎碎念、生活观察、情绪切片。这里只是速览，正文要从「个性思辨 → 日常想法」走进去。</div>
            <div class="ds-stats" id="dsStats"></div>
            <div class="ds-moods" id="dsMoods"></div>
        </div>
        <a class="btn primary" href="./Selects/ThoughtDebate.html">📖 进入日记 ▸</a>
    </section>

    <div class="section-head">可探索的栏目</div>
    <div class="portals-grid" id="dynamicPortals"></div>

    <div class="section-head" id="contact">时光邮局</div>
    <div class="mail-card">
        <div class="mail-header">✉️ 寄信给空曙 <span>时光邮局</span></div>
        <p class="mail-tip">想说点什么都可以写在这里，信会被投递到空曙的邮箱里。悄悄话、感想、或者只是随便聊聊。</p>
        <div class="form-grid">
            <div class="form-row">
                <label>你的名字 <span class="optional">必填</span></label>
                <input type="text" id="senderName" placeholder="如何称呼你？" autocomplete="off">
            </div>
            <div class="form-row">
                <label>联系方式（邮箱 / QQ） <span class="optional">选填，期待回音的话记得留</span></label>
                <input type="text" id="senderContact" placeholder="如：xxx@qq.com 或 QQ 号" autocomplete="off">
            </div>
        </div>
        <div class="form-row">
            <label>你想说的话 📝</label>
            <textarea id="messageContent" rows="5" placeholder="写下你想告诉空曙的任何话…"></textarea>
        </div>
        <div class="send-row">
            <button class="btn primary" id="sendMailBtn">📨 寄出信件</button>
            <span class="send-hint">信件通过 EmailJS 发送，不会公开显示。</span>
        </div>
    </div>

    <div class="extension-note">
        <span>⚡ 道法三千六百门</span><span>🔮</span><span>人人各执一苗根</span>
    </div>
    <footer class="page-foot">✦ 逝影回声 · 所有灵感皆成历史档案 ✦</footer>
</main>

<div class="toast-host" id="toastHost"></div>

<!-- 日记数据镜像：用于主厅的速览统计（不存在时会自动隐藏） -->
<script src="./data/journal.js"></script>

<script>
/* ======================= EmailJS 配置 ======================= */
const EMAILJS_PUBLIC_KEY = "vH-LF4G2lUnkKpKcv";
const EMAILJS_SERVICE_ID = "birth001";
const EMAILJS_TEMPLATE_ID = "template_02vjyr6";
const RECIPIENT_EMAIL = "DreemurrDawnlit@outlook.com";

(function initEmailJS() {
    if (window.emailjs && EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
        emailjs.init(EMAILJS_PUBLIC_KEY);
        console.log("EmailJS 已就绪 | 记忆回廊邮件系统");
    } else {
        console.warn("EmailJS 未配置或 SDK 未加载，邮件功能不可用");
    }
})();

/* ======================= Toast ======================= */
function showMessage(text, isError) {
    const host = document.getElementById('toastHost');
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' err' : ' ok');
    toast.textContent = text;
    host.appendChild(toast);
    setTimeout(() => toast.remove(), 3600);
}

/* ======================= 寄信 ======================= */
async function sendEmail() {
    const nameInput = document.getElementById('senderName');
    const contactInput = document.getElementById('senderContact');
    const messageInput = document.getElementById('messageContent');
    const name = nameInput.value.trim();
    const contact = contactInput.value.trim();
    const message = messageInput.value.trim();

    if (!name) { showMessage("❄️ 请留下你的名字（其实不留也行，咕咕嘎嘎）", true); nameInput.focus(); return; }
    if (!message) { showMessage("📜 请写下你想说的话，歪比巴伯。", true); messageInput.focus(); return; }

    const sendBtn = document.getElementById('sendMailBtn');
    const originalText = sendBtn.innerHTML;
    sendBtn.disabled = true;
    sendBtn.innerHTML = "✈️ 飞鸽传书中…";

    try {
        const fullMessage = `寄信人：${name}\n${contact ? `联系方式：${contact}\n` : ""}\n留言内容：\n${message}\n\n—— 来自记忆回廊的访客 · ${new Date().toLocaleString()}`;
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: RECIPIENT_EMAIL,
            from_name: name,
            message: fullMessage
        });
        showMessage("✨ 信件已乘清风寄出，空曙会看到的（Maybe） ✨");
        messageInput.value = "";
        contactInput.value = "";
    } catch (error) {
        console.error("邮件发送失败", error);
        showMessage("❌ 寄信失败，可能是鸽子罢工了… 稍后再试吧", true);
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalText;
    }
}

/* ======================= 栏目配置（可继续扩展） ======================= */
const PORTALS_CONFIG = [
    {
        id: "thoughtDebate",
        icon: "🧠",
        title: "个性思辨",
        description: "两条脉络：需要反复推敲的思辨话题，与碎碎念式的日常想法。入口处有一道小小的暗号题。",
        link: "Selects/ThoughtDebate.html"
    },
    {
        id: "birthdayArchive",
        icon: "🎂",
        title: "生辰纪念",
        description: "不同年份的生日纪念页面，记录每一圈年轮的回响，包含 20 岁特别版。",
        link: "Selects/BirthdayArchive.html"
    },
    {
        id: "funProjects",
        icon: "🎮",
        title: "趣味整活",
        description: "各种灵感实验场：抽象但有趣的数学人格测试之类的奇怪小东西，持续添加中。",
        link: "Selects/FunProjects.html"
    }
];

function renderPortals() {
    const container = document.getElementById('dynamicPortals');
    container.innerHTML = '';
    PORTALS_CONFIG.forEach(portal => {
        const card = document.createElement('div');
        card.className = 'portal-card';
        card.innerHTML = `
            <div class="card-inner">
                <div class="card-icon">${portal.icon}</div>
                <h2>${portal.title}</h2>
                <p>${portal.description}</p>
                <button class="enter-btn" type="button">进入 ▸</button>
            </div>`;
        const go = () => { window.location.href = portal.link; };
        card.addEventListener('click', go);
        const btn = card.querySelector('.enter-btn');
        btn.addEventListener('click', e => { e.stopPropagation(); go(); });
        container.appendChild(card);
    });
}

/* ======================= 日记速览 ======================= */
function renderDiaryStrip() {
    const data = window.__JOURNAL_DATA__;
    if (!data || !Array.isArray(data.entries) || data.entries.length === 0) return;
    const entries = data.entries;
    const dates = entries.map(e => e.date).filter(Boolean).sort();
    const first = new Date(dates[0]), last = new Date(dates[dates.length - 1]);
    const span = Math.max(1, Math.round((last - first) / 86400000));
    const chars = entries.reduce((s, e) => s + (e.content || '').length, 0);

    document.getElementById('dsStats').innerHTML = `
        <div class="ds-stat"><b>${entries.length}</b>篇记录</div>
        <div class="ds-stat"><b>${span}</b>天跨度</div>
        <div class="ds-stat"><b>${chars.toLocaleString()}</b>字正文</div>
        <div class="ds-stat"><b>${dates[dates.length - 1]}</b>最近更新</div>`;

    const counts = new Map();
    entries.forEach(e => {
        const key = e.mood || '未标注';
        counts.set(key, (counts.get(key) || 0) + 1);
    });
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
    document.getElementById('dsMoods').innerHTML =
        top.map(([mood, n]) => `<span class="mood-pill">${mood} · ${n}</span>`).join('');

    document.getElementById('diaryStrip').hidden = false;
}

/* ======================= 启动 ======================= */
document.addEventListener('DOMContentLoaded', () => {
    const theme = (() => { try { return localStorage.getItem('journal.theme.v1'); } catch (e) { return null; } })();
    const night = theme && theme.indexOf('night') >= 0;
    document.documentElement.dataset.theme = night ? 'night' : 'day';
    document.getElementById('themeBtn').textContent = night ? '☀️' : '🌙';
    document.getElementById('themeBtn').addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
        document.documentElement.dataset.theme = next;
        document.getElementById('themeBtn').textContent = next === 'night' ? '☀️' : '🌙';
        try { localStorage.setItem('journal.theme.v1', JSON.stringify(next)); } catch (e) {}
    });

    renderPortals();
    renderDiaryStrip();
    document.getElementById('sendMailBtn').addEventListener('click', sendEmail);
});
</script>
</body>
</html>
