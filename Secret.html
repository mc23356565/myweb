<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>我们的小窝</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style/css/index.css">
    <link rel="stylesheet" href="Style/css/animate.min.css">
</head>

<body>
    <!-- 顶栏 / Banner / 页脚由 assets/app-core.js 按 LikeGirl head.php/footer.php 注入 -->

    <div id="pjax-container">
        <!-- 时间区域（index.php 的 .time） -->
        <div class="central">
            <div id="mainHost">
                <div class="gate-card"><span class="spin"></span><h2>正在检查登录状态…</h2></div>
            </div>
        </div>

        <template id="homeContent">
            <!-- 时间区域 -->
            <div class="time">
                <span id="span_dt_dt"></span>
                <b id="tian"></b>
                <b id="shi"></b>
                <b id="fen"></b>
                <b id="miao"></b>
            </div>
            <!-- 卡片区域 -->
            <div class="card-wrap">
                <div class="row central">
                    <div class="card col-lg-4 col-sm-12 col-sm-x-12 flex-h animated fadeInUp">
                        <img src="Style/img/home/home-page.svg">
                        <div class="text">
                            <span><a href="Articles/index.html">朴实文章</a></span>
                            <p>把日子过成文字</p>
                        </div>
                    </div>
                    <div class="card col-lg-4 col-sm-12 col-sm-x-12 flex-h animated fadeInUp">
                        <img src="Style/img/home/home-msg.svg">
                        <div class="text">
                            <span><a href="Questionnaires/index.html">问卷小屋</a></span>
                            <p>出题考考对方</p>
                        </div>
                    </div>
                    <div class="card col-lg-4 col-sm-12 col-sm-x-12 flex-h animated fadeInUp">
                        <img src="Style/img/home/home-about.svg">
                        <div class="text">
                            <span><a href="Admin.html">后台</a></span>
                            <p>站点配置与管理</p>
                        </div>
                    </div>
                    <div class="card-b col-lg-6 col-12 col-sm-12 flex-h animated fadeInUp">
                        <img src="Style/img/home/home-photo.svg">
                        <div class="text">
                            <span><a href="Photos/index.html">Love Photo</a></span>
                            <p>恋爱相册 记录最美瞬间</p>
                        </div>
                    </div>
                    <div class="card-b col-lg-6 col-12 col-sm-12 flex-h animated fadeInUp">
                        <img src="Style/img/home/home-list.svg">
                        <div class="text">
                            <span><a href="List/index.html">Love List</a></span>
                            <p>恋爱列表 你我之间的约定</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script src="assets/app-core.js"></script>
    <script>
    (async function () {
        const app = await SiteApp.init({ shell: 'lg', main: '#mainHost' });
        const host = document.getElementById('mainHost');
        if (!app.me) return; // 登录门已渲染

        host.innerHTML = '';
        host.appendChild(document.getElementById('homeContent').content.cloneNode(true));
        // 卡片点击跳转（footer.php 的行为）
        host.querySelectorAll('.card, .card-b').forEach(card => {
            card.addEventListener('click', () => {
                const a = card.querySelector('a');
                if (a) location.href = a.getAttribute('href');
            });
        });

        // 计时器（head.php 的 show_date_time，起点来自「后台 → 情侣配置」的 since）
        const BirthDay = new Date(app.config.since || '2026-04-06');
        function show_date_time() {
            window.setTimeout(show_date_time, 1000);
            const today = new Date();
            const timeold = today.getTime() - BirthDay.getTime();
            if (timeold < 0) return;
            const msPerDay = 24 * 60 * 60 * 1000;
            const daysold = Math.floor(timeold / msPerDay);
            const hrsold = Math.floor((timeold / msPerDay - daysold) * 24);
            const minsold = Math.floor(((timeold / msPerDay - daysold) * 24 - hrsold) * 60);
            let seconds = Math.floor((((timeold / msPerDay - daysold) * 24 - hrsold) * 60 - minsold) * 60);
            const ki = document.getElementById('span_dt_dt');
            if (ki === null) return;
            ki.innerHTML = '这是我们一起走过的';
            document.getElementById('tian').innerHTML = daysold + '天';
            document.getElementById('shi').innerHTML = hrsold + '时';
            document.getElementById('fen').innerHTML = minsold + '分';
            if (seconds < 10) seconds = '0' + seconds;
            document.getElementById('miao').innerHTML = seconds + '秒';
        }
        show_date_time();
    })();
    </script>
</body>

</html>
