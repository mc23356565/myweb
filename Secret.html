<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>空曙·记忆回廊 | 主厅</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e9e2d4 0%, #d9cebc 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* 主容器 */
        .archive-hall {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 标题区域 + 旧时光印记 */
        .hero {
            text-align: center;
            margin-bottom: 3.5rem;
        }
        .hero h1 {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #3f2e1e, #6f4e2e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        }
        .hero p {
            color: #6a5a48;
            margin-top: 0.5rem;
            font-size: 1rem;
            border-top: 1px solid #cfbea5;
            display: inline-block;
            padding-top: 0.6rem;
            font-style: italic;
        }

        /* 可扩展栏目网格 */
        .portals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .portal-card {
            background: rgba(255, 250, 240, 0.92);
            backdrop-filter: blur(0px);
            border-radius: 2rem;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 1px solid #efdfc9;
            overflow: hidden;
            cursor: pointer;
        }
        .portal-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 32px -14px rgba(45, 30, 20, 0.25);
            background: #fffcf5;
            border-color: #cfb992;
        }

        .card-inner {
            padding: 1.8rem 1.8rem 2rem;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
        .portal-card h2 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #4b3621;
            letter-spacing: -0.2px;
            margin-bottom: 0.5rem;
        }
        .portal-card p {
            color: #7b6a53;
            line-height: 1.4;
            margin: 0.6rem 0 1.2rem;
        }
        .enter-btn {
            display: inline-block;
            background: #b1845c;
            color: white;
            padding: 0.5rem 1.4rem;
            border-radius: 3rem;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }
        .portal-card:hover .enter-btn {
            background: #8e623f;
        }

        /* 邮件卡片样式 */
        .mail-card {
            background: #fffef7;
            border-radius: 2rem;
            border: 1px solid #e6d5bc;
            padding: 2rem 2rem 2rem 2rem;
            margin: 2rem 0 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .mail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
            font-weight: 600;
            color: #4f3a24;
        }
        .mail-header span {
            font-size: 1rem;
            background: #efe3d2;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-weight: normal;
            font-size: 0.8rem;
        }
        .form-row {
            margin-bottom: 1.2rem;
        }
        .form-row label {
            display: block;
            font-weight: 500;
            color: #6a4e32;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-row input, .form-row textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e2d0b6;
            border-radius: 1.2rem;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fefcf7;
            transition: 0.2s;
            resize: vertical;
        }
        .form-row input:focus, .form-row textarea:focus {
            outline: none;
            border-color: #b48c5c;
            box-shadow: 0 0 0 3px rgba(180,140,92,0.2);
        }
        .send-btn {
            background: #9b7b5a;
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .send-btn:hover {
            background: #7e5f3e;
            transform: translateY(-2px);
        }
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .optional {
            font-size: 0.7rem;
            color: #b2906c;
            margin-left: 0.5rem;
        }
        /* toast 通知 */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e2a24e6;
            backdrop-filter: blur(8px);
            color: #fae6cd;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            border: 1px solid #c6aa7e;
            animation: slideUpFade 0.25s ease;
            white-space: nowrap;
            pointer-events: none;
            font-family: monospace;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .extension-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #987b5a;
            background: #f8efdf;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px dashed #cfb284;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #a68f72;
        }
        @media (max-width: 700px) {
            body { padding: 1.2rem; }
            .hero h1 { font-size: 2.2rem; }
            .portal-card h2 { font-size: 1.5rem; }
            .mail-card { padding: 1.5rem; }
            .toast-message { white-space: normal; max-width: 90%; text-align: center; }
        }
    </style>
</head>
<body>
<div class="archive-hall">
    <div class="hero">
        <h1>📜 空曙·记忆回廊</h1>
        <p>被时光封存的低语 · 每一个选择都会开启一段全新体验</p>
    </div>

    <!-- 可扩展栏目网格 -->
    <div class="portals-grid" id="dynamicPortals"></div>

    <!-- 📧 邮件联系卡片 -->
    <div class="mail-card">
        <div class="mail-header">
            ✉️ 寄信给空曙 <span>时光邮局</span>
        </div>
        <div class="form-row">
            <label>你的名字 <span class="optional">(必填)</span></label>
            <input type="text" id="senderName" placeholder="如何称呼你？" autocomplete="off">
        </div>
        <div class="form-row">
            <label>联系方式（邮箱/QQ）<span class="optional">选填，但若期待回音请留</span></label>
            <input type="text" id="senderContact" placeholder="如：xxx@qq.com 或 QQ号" autocomplete="off">
        </div>
        <div class="form-row">
            <label>你想说的话 📝</label>
            <textarea id="messageContent" rows="4" placeholder="写下你想告诉空曙的任何话… 悄悄话、感想或者随便聊聊。"></textarea>
        </div>
        <button class="send-btn" id="sendMailBtn">📨 寄出信件</button>
    </div>

    <div class="extension-note">
        <span>⚡ 道法三千六百门</span>
        <span>🔮</span>
        <span>人人各执一苗根</span>
    </div>
    <footer>✦ 逝影回声 · 所有灵感皆成历史档案 ✦</footer>
</div>

<script>
    // ======================= EmailJS 配置（基于用户提供） =======================
    const EMAILJS_PUBLIC_KEY = "vH-LF4G2lUnkKpKcv";
    const EMAILJS_SERVICE_ID = "birth001";
    const EMAILJS_TEMPLATE_ID = "template_02vjyr6";
    const RECIPIENT_EMAIL = "DreemurrDawnlit@outlook.com";

    // 初始化 EmailJS
    (function initEmailJS() {
        if (EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
            emailjs.init(EMAILJS_PUBLIC_KEY);
            console.log("EmailJS 已就绪 | 记忆回廊邮件系统");
        } else {
            console.warn("EmailJS 未配置，邮件功能不可用");
        }
    })();

    // ======================= Toast 提示 =======================
    let toastTimer = null;
    function showMessage(text, isError = false) {
        const existingToast = document.querySelector('.toast-message');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = text;
        if (isError) toast.style.background = "#752e2ee6";
        document.body.appendChild(toast);
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            const t = document.querySelector('.toast-message');
            if (t) t.remove();
            toastTimer = null;
        }, 3500);
    }

    // ======================= 发送邮件函数 =======================
    async function sendEmail() {
        const nameInput = document.getElementById('senderName');
        const contactInput = document.getElementById('senderContact');
        const messageInput = document.getElementById('messageContent');
        
        const name = nameInput ? nameInput.value.trim() : "";
        const contact = contactInput ? contactInput.value.trim() : "";
        const message = messageInput ? messageInput.value.trim() : "";
        
        if (!name) {
            showMessage("❄️ 请留下你的名字（其实不留也行，咕咕嘎嘎）", true);
            nameInput.focus();
            return;
        }
        if (!message) {
            showMessage("📜 请写下你想说的话，歪比巴伯。", true);
            messageInput.focus();
            return;
        }
        
        const sendBtn = document.getElementById('sendMailBtn');
        const originalText = sendBtn.innerHTML;
        sendBtn.disabled = true;
        sendBtn.innerHTML = "✈️ 飞鸽传书中...";
        
        try {
            // 组合邮件内容
            const fullMessage = `寄信人：${name}\n${contact ? `联系方式：${contact}\n` : ""}\n留言内容：\n${message}\n\n—— 来自记忆回廊的访客 · ${new Date().toLocaleString()}`;
            const templateParams = {
                to_email: RECIPIENT_EMAIL,
                from_name: name,
                message: fullMessage
            };
            const response = await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
            console.log("邮件发送成功", response);
            showMessage("✨ 信件已乘清风寄出，空曙会看到的（Maybe） ✨");
            // 清空表单
            if (messageInput) messageInput.value = "";
            if (contactInput) contactInput.value = "";
            // 保留名字不清空，方便连续写信
        } catch (error) {
            console.error("邮件发送失败", error);
            showMessage("❌ 寄信失败，可能是鸽子罢工了… 稍后再试吧", true);
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = originalText;
        }
    }
    
    // ======================= 可扩展栏目配置 =======================
    const PORTALS_CONFIG = [
        {
            id: "birthdayArchive",
            icon: "🎂✨",
            title: "生辰纪念",
            description: "不同年份的生日纪念页面，记录每一圈年轮的回响。包含20岁特别版。",
            link: "Selects/BirthdayArchive.html",
            color: "#b48c5c"
        },
        {
            id: "funProjects",
            icon: "🎮⚙️",
            title: "趣味整活",
            description: "即将释放的娱乐小宇宙，各种灵感实验场，持续添加整活项目。",
            link: "Selects/FunProjects.html",
            color: "#6f8f6f"
        },
        {
            id: "thoughtDebate",
            icon: "🧠💭",
            title: "个性思辨",
            description: "按日期沉淀的话题卡片，展开即见深藏思绪。可随时扩充话题库。",
            link: "Selects/ThoughtDebate.html",
            color: "#aa7c58"
        }
    ];

    function renderPortals() {
        const container = document.getElementById('dynamicPortals');
        if (!container) return;
        container.innerHTML = '';
        PORTALS_CONFIG.forEach(portal => {
            const card = document.createElement('div');
            card.className = 'portal-card';
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('.enter-btn')) return;
                window.location.href = portal.link;
            });
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-icon">${portal.icon}</div>
                    <h2>${portal.title}</h2>
                    <p>${portal.description}</p>
                    <button class="enter-btn" data-link="${portal.link}">进入 ▸</button>
                </div>
            `;
            const btn = card.querySelector('.enter-btn');
            if (btn) {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.location.href = portal.link;
                });
            }
            container.appendChild(card);
        });
    }
    
    // 绑定发送按钮事件
    document.addEventListener('DOMContentLoaded', () => {
        renderPortals();
        const sendBtn = document.getElementById('sendMailBtn');
        if (sendBtn) sendBtn.addEventListener('click', sendEmail);
    });
</script>
</body>
</html>
