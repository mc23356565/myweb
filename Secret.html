<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>空曙 · 记忆回廊</title>
<meta name="description" content="空曙的记忆回廊：私人领域，仅限二人。生辰纪念、个性思辨、问卷小屋，都藏在登录之后。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/style.css">
<style>
/* 仅本页：私人领域提示条 */
.private-strip {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1.3rem 1.6rem; margin: 2.4rem 0 0;
}
.private-strip .ps-icon { font-size: 2rem; line-height: 1; }
.private-strip .ps-main { flex: 1 1 320px; min-width: 240px; }
.private-strip .ps-title { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.private-strip .ps-desc { color: var(--ink-2); font-size: .85rem; line-height: 1.8; margin-top: 6px; }
</style>
</head>
<body data-page="home">

<!-- LikeGirl 式 Banner：双头像 + 心跳 + 波浪 -->
<section class="banner">
    <div class="middle">
        <img class="ava" src="./assets/avatar-a.svg" alt="空曙的头像" title="空曙（可替换 assets/avatar-a.svg）">
        <svg class="love-icon" viewBox="0 0 100 100" aria-hidden="true">
            <path fill="#fa5c7d" d="M50 88 C20 64 6 48 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 48 80 64 50 88 Z"/>
        </svg>
        <img class="ava" src="./assets/avatar-b.svg" alt="她的头像" title="她（可替换 assets/avatar-b.svg）">
    </div>
    <h1 class="banner-title">空曙 · 记忆回廊</h1>
    <p class="banner-sub">被时光封存的低语 · 每一个选择都会开启一段全新体验</p>
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
            <path id="wavePath" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
        </defs>
        <g class="parallax">
            <use href="#wavePath" x="48" y="0" fill="rgba(255,255,255,0.7)"/>
            <use href="#wavePath" x="48" y="3" fill="rgba(255,255,255,0.5)"/>
            <use href="#wavePath" x="48" y="5" fill="rgba(255,255,255,0.3)"/>
            <use href="#wavePath" x="48" y="7" fill="#ffffff"/>
        </g>
    </svg>
</section>

<main class="central">
    <!-- 私人领域提示条 -->
    <section class="private-strip">
        <div class="ps-icon">🔒</div>
        <div class="ps-main">
            <div class="ps-title">私人领域 · 仅限二人 <span class="badge">需要登录</span></div>
            <div class="ps-desc">
                整站的所有内容，现在都需要账号登录才能访问。账号一共只有两个 —— 你的，和她的，都存在 Supabase 里。
                两个人的权限完全一样：看内容、写日记、出问卷、进后台，都可以。
            </div>
        </div>
        <a class="btn blue" href="./Selects/ThoughtDebate.html">📖 前往入口 ▸</a>
    </section>

    <div id="pageMain">
        <div class="gate-card">
            <span class="spin" style="width:22px;height:22px;border-width:3px;color:var(--blue-2)"></span>
            <h2>正在检查登录状态…</h2>
        </div>
    </div>

    <template id="homeContent">
        <!-- 在一起计时器（改 SINCE 即可换纪念起点） -->
        <div class="timer">
            <div class="timer-label">✦ 记忆回廊 · 已陪伴我们 ✦</div>
            <div class="timer-digits" id="sinceTimer">— 天 — 时 — 分 — 秒</div>
        </div>

        <div class="section-head">可探索的栏目</div>
        <p class="section-sub">每一个选择都会开启一段全新体验。</p>
        <div class="card-grid">
            <div class="card clickable anim-up" data-link="./Selects/ThoughtDebate.html">
                <div class="card-icon">🧠</div>
                <h2>个性思辨</h2>
                <p>两条脉络：需要反复推敲的思辨话题，与碎碎念式的日常想法。我们俩都能读，也都能写。</p>
                <button class="btn sm ghost" type="button">进入 ▸</button>
            </div>
            <div class="card clickable anim-up" data-link="./Selects/BirthdayArchive.html">
                <div class="card-icon">🎂</div>
                <h2>生辰纪念</h2>
                <p>不同年份的生日纪念页面，记录每一圈年轮的回响，包含 20 岁特别版。</p>
                <button class="btn sm ghost" type="button">进入 ▸</button>
            </div>
            <div class="card clickable anim-up" data-link="./Questionnaires/index.html">
                <div class="card-icon">📝</div>
                <h2>问卷小屋</h2>
                <p>出一份问卷考考对方，或者答完她出的题。每道题的答案，两个人都能互相查看。</p>
                <button class="btn sm ghost" type="button">进入 ▸</button>
            </div>
        </div>

        <div class="wide-grid">
            <div class="card-b anim-up" data-link="./Selects/FunProjects.html">
                <div class="card-icon">🎮</div>
                <div>
                    <h2>趣味整活</h2>
                    <p>各种灵感实验场：奇怪又迷人的小东西，持续添加中。</p>
                </div>
                <span class="go">前往 ▸</span>
            </div>
            <div class="card-b anim-up" data-link="./Admin.html">
                <div class="card-icon">🛠</div>
                <div>
                    <h2>后台</h2>
                    <p>站点统计、问卷管理、数据备份与数据库说明，所有账号都有权访问。</p>
                </div>
                <span class="go">前往 ▸</span>
            </div>
        </div>

        <div class="page-foot">
            <div>⚡ 道法三千六百门 · 🔮 人人各执一苗根</div>
            <div class="foot-quote">✦ 逝影回声 · 所有灵感皆成历史档案 ✦</div>
        </div>
    </template>
</main>

<script src="./assets/app-core.js"></script>
<script>
(async function () {
    const params = new URLSearchParams(location.search);
    const app = await SiteApp.init({ active: 'home', main: '#pageMain' });
    const main = document.getElementById('pageMain');
    if (!app.me) {
        // 未登录：登录门已渲染；如果是从别的页跳回来的，提示一下
        if (params.get('needlogin')) SiteApp.toast('请先登录，才能访问那些内容 🔒', 'err', 3600);
        return;
    }
    // 已登录：渲染主厅内容
    main.innerHTML = '';
    main.appendChild(document.getElementById('homeContent').content.cloneNode(true));
    main.querySelectorAll('[data-link]').forEach(card => {
        card.addEventListener('click', () => location.href = card.dataset.link);
    });

    // 计时器：从纪念起点开始计数（想改起点就改这一行日期）
    const SINCE = new Date('2026-04-06T00:00:00');
    const tick = () => {
        const diff = Math.max(0, Date.now() - SINCE.getTime());
        const d = Math.floor(diff / 86400000);
        const h = Math.floor(diff / 3600000) % 24;
        const m = Math.floor(diff / 60000) % 60;
        const s = Math.floor(diff / 1000) % 60;
        document.getElementById('sinceTimer').innerHTML =
            d + '<span class="unit"> 天</span>' + h + '<span class="unit"> 时</span>' + m + '<span class="unit"> 分</span>' + s + '<span class="unit"> 秒</span>';
    };
    tick();
    setInterval(tick, 1000);
})();
</script>
</body>
</html>
