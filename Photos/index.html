<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Love Photo</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Style/css/index.css">
    <link rel="stylesheet" href="../Style/css/loveImg.css">
    <link rel="stylesheet" href="../Style/css/animate.min.css">
    <link rel="stylesheet" href="../Style/css/ops.css">
</head>

<body>
    <!-- 顶栏 / Banner / 页脚由 assets/app-core.js 按 LikeGirl head.php/footer.php 注入 -->

    <div id="pjax-container">
        <h4 class="text-ce central" style="text-align:center;font-size:1.8rem;font-family:'Noto Serif SC',serif;font-weight:700;">记录下你的最美瞬间</h4>
        <div class="lg-opsbar" style="margin-bottom:1.4rem;">
            <button class="lg-btn blue" id="addBtn">＋ 添加照片</button>
        </div>
        <div class="row central" id="photoHost">
            <div class="lg-empty" style="grid-column:1/-1">正在检查登录状态…</div>
        </div>
    </div>

    <!-- 添加照片 -->
    <div class="lg-mask" id="editMask">
        <div class="lg-modal narrow">
            <div class="lg-mhead"><h3>＋ 添加照片</h3><button class="x" data-close="editMask">✕</button></div>
            <div class="lg-mbody">
                <div class="field"><label>上传图片<span class="hint">直接选文件，存到 Supabase Storage</span></label>
                    <input class="input" type="file" id="photoFile" accept="image/*"></div>
                <div class="field"><label>或图片链接<span class="hint">二选一</span></label>
                    <input class="input" id="photoUrl" placeholder="https://…" autocomplete="off"></div>
                <div class="field"><label>日期</label>
                    <input class="input" type="date" id="photoDate"></div>
                <div class="field"><label>想说什么</label>
                    <input class="input" id="photoCaption" placeholder="例如：第一次一起看海 🌊" autocomplete="off"></div>
                <div class="lg-err" id="editError"></div>
            </div>
            <div class="lg-mfoot">
                <span class="grow"></span>
                <button class="lg-btn" data-close="editMask">取消</button>
                <button class="lg-btn blue" id="editSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 大图浏览 -->
    <div class="lg-mask" id="viewMask">
        <div class="lg-modal lg-lightbox">
            <div class="lg-mhead"><h3 id="viewTitle">照片</h3><button class="x" data-close="viewMask">✕</button></div>
            <div class="lg-mbody">
                <img id="viewImg" alt="">
                <p class="cap" id="viewCaption"></p>
            </div>
        </div>
    </div>

    <script src="../assets/app-core.js"></script>
    <script>
    (async function () {
        const app = await SiteApp.init({ shell: 'lg', main: '#photoHost' });
        if (!app.me) return; // 登录门已渲染

        const host = document.getElementById('photoHost');
        let photos = [];

        function openMask(id) { document.getElementById(id).classList.add('show'); }
        function closeMask(id) { document.getElementById(id).classList.remove('show'); }
        document.querySelectorAll('[data-close]').forEach(x => x.addEventListener('click', () => closeMask(x.dataset.close)));
        document.querySelectorAll('.lg-mask').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('show'); }));

        async function load() {
            try {
                photos = (await app.sbRest('photos?select=*&order=date.desc,created_at.desc')) || [];
            } catch (e) {
                host.innerHTML = '<div class="lg-empty" style="grid-column:1/-1">加载失败：' + app.esc(e.message) +
                    '<br>（可能需要先去后台执行「数据库安装」里的 SQL）</div>';
                return;
            }
            render();
        }

        function render() {
            if (!photos.length) {
                host.innerHTML = '<div class="lg-empty" style="grid-column:1/-1">📷 还没有照片 —— 点上面的「＋ 添加照片」存下第一张吧</div>';
                return;
            }
            host.innerHTML = photos.map((p, i) =>
                '<div class="img_card col-lg-4 col-md-6 col-sm-12 col-sm-x-12 animated zoomIn" data-i="' + i + '">' +
                    '<button class="lg-del" data-del="' + app.esc(p.id) + '" title="删除">✕</button>' +
                    '<div class="love_img">' +
                        '<img loading="lazy" src="' + app.esc(p.url) + '" alt="' + app.esc(p.caption || '照片') + '">' +
                        '<div class="words"><i>Date：' + app.esc(p.date || '') + '</i><span>' + app.esc(p.caption || '') + '</span></div>' +
                    '</div>' +
                '</div>').join('');
            host.querySelectorAll('.img_card').forEach(card => {
                card.addEventListener('click', ev => {
                    if (ev.target.closest('.lg-del')) return;
                    const p = photos[+card.dataset.i];
                    document.getElementById('viewImg').src = p.url;
                    document.getElementById('viewTitle').textContent = p.date || '照片';
                    document.getElementById('viewCaption').textContent = p.caption || '';
                    openMask('viewMask');
                });
            });
            host.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', ev => {
                ev.stopPropagation();
                del(btn.dataset.del);
            }));
        }

        async function del(id) {
            const p = photos.find(x => x.id === id);
            if (!p) return;
            if (!confirm('确定删除这张照片？\n' + (p.caption || p.date || ''))) return;
            try {
                await app.sbRest('photos?id=eq.' + encodeURIComponent(id), { method: 'DELETE' });
                photos = photos.filter(x => x.id !== id);
                render();
                app.toast('已删除 🗑', 'ok');
            } catch (e) { app.toast('删除失败：' + e.message, 'err', 4000); }
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            document.getElementById('photoFile').value = '';
            document.getElementById('photoUrl').value = '';
            document.getElementById('photoDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('photoCaption').value = '';
            document.getElementById('editError').textContent = '';
            openMask('editMask');
        });

        document.getElementById('editSave').addEventListener('click', async () => {
            const err = document.getElementById('editError');
            const btn = document.getElementById('editSave');
            err.textContent = '';
            let url = document.getElementById('photoUrl').value.trim();
            const date = document.getElementById('photoDate').value || '';
            const caption = document.getElementById('photoCaption').value.trim();
            const file = document.getElementById('photoFile').files[0];
            if (!url && !file) { err.textContent = '选一个图片文件，或填一个图片链接'; return; }
            const old = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '保存中…';
            try {
                if (file) {
                    btn.innerHTML = '上传中…';
                    url = await uploadToStorage(file);
                }
                const row = { id: 'ph' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6), url: url, caption: caption, date: date };
                await app.sbRest('photos', { method: 'POST', body: row });
                photos.unshift(row);
                closeMask('editMask');
                render();
                app.toast('已保存 ✓', 'ok');
            } catch (e) {
                err.textContent = '❌ ' + e.message;
            } finally {
                btn.disabled = false; btn.innerHTML = old;
            }
        });

        async function uploadToStorage(file) {
            const ext = (file.name.match(/\.\w+$/) || ['.jpg'])[0];
            const path = 'ph' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6) + ext;
            const res = await fetch(SiteApp.sbUrl() + '/storage/v1/object/photos/' + path, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + SiteApp.session().accessToken },
                body: file
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                const msg = data.message || data.error || ('上传失败（' + res.status + '）');
                if (/Bucket not found|does not exist/i.test(msg)) {
                    throw new Error('Storage 里还没有公开桶 photos —— 去 Supabase SQL Editor 执行一遍 supabase-install.sql 即可自动创建');
                }
                throw new Error(msg);
            }
            return SiteApp.sbUrl() + '/storage/v1/object/public/photos/' + path;
        }

        load();
    })();
    </script>
</body>

</html>
