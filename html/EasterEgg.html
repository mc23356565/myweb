<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>铃姐，生日快乐！</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: absolute;
    }
    
    /* 音乐控制按钮样式 */
    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .music-control:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
    }
    
    .music-icon {
      color: white;
      font-size: 20px;
    }
    
    /* 提示信息 */
    .play-hint {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      z-index: 100;
      opacity: 0;
      transition: opacity 1s ease;
    }
    
    .play-hint.show {
      opacity: 1;
    }
    
    /* 生日文字样式 */
    .birthday-text {
      position: fixed;
      top: 20%;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 2em;
      font-weight: bold;
      z-index: 50;
      opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      pointer-events: none;
      padding: 0 20px;
      line-height: 1.5;
    }
    
    .birthday-text.semi-transparent {
      opacity: 0.5;
    }
    
    .birthday-text.fully-visible {
      opacity: 1;
    }
    
    /* 计时器样式 */
    .timer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: white;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 100;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- 音乐控制按钮 -->
  <div class="music-control" id="musicToggle">
    <div class="music-icon">♪</div>
  </div>
  
  <!-- 播放提示 -->
  <div class="play-hint" id="playHint">点击右上角按钮控制音乐</div>

  <!-- 生日文字 -->
  <div class="birthday-text" id="birthdayText"></div>
  
  <!-- 计时器 -->
  <div class="timer" id="timer">已观看: 0分钟0秒</div>

  <canvas></canvas>
  <canvas></canvas>
  <canvas></canvas>
  
  <!-- 音频元素 -->
  <audio id="bgMusic" loop>
    <source src="../music/3.mp3" autoplay="autoplay" type="audio/mp3">
    您的浏览器不支持音频元素。
  </audio>

  <script>
    // 百度统计代码
    var _hmt = _hmt || [];
    (function () {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?c923daf3182a4b0ce01878475080aadc";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();

    // 音乐控制功能
    const musicToggle = document.getElementById('musicToggle');
    const bgMusic = document.getElementById('bgMusic');
    const playHint = document.getElementById('playHint');
    const birthdayText = document.getElementById('birthdayText');
    const timerElement = document.getElementById('timer');
    let musicPlaying = false;
    
    // 时间控制变量
    let startTime = Date.now();
    let timeOffset = 0; // 用于手动调整时间
    
    // 显示提示信息
    function showHint() {
      playHint.classList.add('show');
      setTimeout(() => {
        playHint.classList.remove('show');
      }, 3000);
    }
    
    // 尝试播放音乐
    function playMusic() {
      bgMusic.play().then(() => {
        musicPlaying = true;
        musicToggle.innerHTML = '<div class="music-icon">♫</div>';
      }).catch(error => {
        console.log('自动播放受阻:', error);
        showHint();
      });
    }
    
    // 暂停音乐
    function pauseMusic() {
      bgMusic.pause();
      musicPlaying = false;
      musicToggle.innerHTML = '<div class="music-icon">♪</div>';
    }
    
    // 切换音乐状态
    musicToggle.addEventListener('click', function() {
      if (musicPlaying) {
        pauseMusic();
      } else {
        playMusic();
      }
    });
    
    // 页面点击时尝试自动播放（解决浏览器自动播放限制）
    document.body.addEventListener('click', function() {
      if (!musicPlaying) {
        playMusic();
      }
    }, { once: true });
    
    // 初始显示提示
    setTimeout(showHint, 1000);

    // 更新计时器显示
    function updateTimer() {
      const currentTime = Date.now();
      const elapsedSeconds = (currentTime - startTime + timeOffset) / 1000;
      const minutes = Math.floor(elapsedSeconds / 60);
      const seconds = Math.floor(elapsedSeconds % 60);
      
      timerElement.textContent = `已观看: ${minutes}分钟${seconds}秒`;
      
      // 继续更新
      setTimeout(updateTimer, 1000);
    }
    
    // 启动计时器
    setTimeout(updateTimer, 1000);

    // 文字显示控制
    function checkTextDisplay() {
      const currentTime = Date.now();
      const elapsedSeconds = (currentTime - startTime + timeOffset) / 1000;
      const elapsedMinutes = elapsedSeconds / 60;
      
      // 先重置字体大小
      birthdayText.style.fontSize = "2em";
      
      // 根据时间显示不同的文字
      if (elapsedSeconds >= 10 && elapsedSeconds < 30) {
        // 10-30秒: 显示第一段文字
        birthdayText.textContent = "以上就是全部内容了,看完就可以退了";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 10 && elapsedMinutes < 15) {
        // 10-15分钟: 显示第二段文字（半透明）
        birthdayText.textContent = "不是,怎么还没退出?";
        birthdayText.classList.remove('fully-visible');
        birthdayText.classList.add('semi-transparent');
      } else if (elapsedMinutes >= 15 && elapsedMinutes < 20) {
        // 15-20分钟: 显示第三段文字
        birthdayText.textContent = "好吧好吧,这么有毅力";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 20 && elapsedMinutes < 21) {
        // 20-21分钟: 显示第四段文字
        birthdayText.textContent = "有句话,想对你说";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 21 && elapsedMinutes < 22) {
        // 21-25分钟: 显示第五段文字
        birthdayText.textContent = "我喜欢你,李铃钰";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 22 && elapsedMinutes < 23) {
        // 21-25分钟: 显示第五段文字
        birthdayText.textContent = "我胆小,害怕告诉你了,连朋友也做不成";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 23 && elapsedMinutes < 24) {
        // 21-25分钟: 显示第五段文字
        birthdayText.textContent = "好吧,其实你根本看不到这里";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else if (elapsedMinutes >= 24 && elapsedMinutes < 25) {
        // 21-25分钟: 显示第五段文字
        birthdayText.textContent = "或许这就是最后的彩蛋吧";
        birthdayText.classList.remove('semi-transparent');
        birthdayText.classList.add('fully-visible');
      } else {
        // 其他时间隐藏文字
        birthdayText.textContent = "";
        birthdayText.classList.remove('semi-transparent', 'fully-visible');
      }
      
      // 继续检查
      setTimeout(checkTextDisplay, 1000);
    }
    
    // 启动文字显示检查
    setTimeout(checkTextDisplay, 1000);

    // 计时器点击事件 - 快速跳转时间
    timerElement.addEventListener('click', function() {
      // 每次点击增加10秒
      timeOffset += 10 * 1000;
      
      // 如果超过25分钟，重置到开始
      if ((Date.now() - startTime + timeOffset) / (1000 * 60) >= 25) {
        timeOffset = 0;
      }
    });

    // 原有的烟花效果代码
    function GetRequest() {
      var url = decodeURI(location.search);
      var theRequest = new Object();
      if (url.indexOf("?") != -1) {
        var str = url.substr(1);
        strs = str.split("&");
        for (var i = 0; i < strs.length; i++) {
          theRequest[strs[i].split("=")[0]] = unescape(strs[i].split("=")[1]);
        }
      }
      return theRequest;
    }
    
    class Shard {
      constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        this.hue = hue;
        this.lightness = 50;
        this.size = 15 + Math.random() * 10;
        const angle = Math.random() * 2 * Math.PI;
        const blastSpeed = 1 + Math.random() * 6;
        this.xSpeed = Math.cos(angle) * blastSpeed;
        this.ySpeed = Math.sin(angle) * blastSpeed;
        this.target = getTarget();
        this.ttl = 100;
        this.timer = 0;
      }
      draw() {
        ctx2.fillStyle = `hsl(${this.hue}, 100%, ${this.lightness}%)`;
        ctx2.beginPath();
        ctx2.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
        ctx2.closePath();
        ctx2.fill();
      }
      update() {
        if (this.target) {
          const dx = this.target.x - this.x;
          const dy = this.target.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const a = Math.atan2(dy, dx);
          const tx = Math.cos(a) * 5;
          const ty = Math.sin(a) * 5;
          this.size = lerp(this.size, 1.5, 0.05);

          if (dist < 5) {
            this.lightness = lerp(this.lightness, 100, 0.01);
            this.xSpeed = this.ySpeed = 0;
            this.x = lerp(this.x, this.target.x + fidelity / 2, 0.05);
            this.y = lerp(this.y, this.target.y + fidelity / 2, 0.05);
            this.timer += 1;
          } else
            if (dist < 10) {
              this.lightness = lerp(this.lightness, 100, 0.01);
              this.xSpeed = lerp(this.xSpeed, tx, 0.1);
              this.ySpeed = lerp(this.ySpeed, ty, 0.1);
              this.timer += 1;
            } else {
              this.xSpeed = lerp(this.xSpeed, tx, 0.02);
              this.ySpeed = lerp(this.ySpeed, ty, 0.02);
            }
        } else {
          this.ySpeed += 0.05;
          this.size = lerp(this.size, 1, 0.05);

          if (this.y > c2.height) {
            shards.forEach((shard, idx) => {
              if (shard === this) {
                shards.splice(idx, 1);
              }
            });
          }
        }
        this.x = this.x + this.xSpeed;
        this.y = this.y + this.ySpeed;
      }
    }

    class Rocket {
      constructor() {
        const quarterW = c2.width / 4;
        this.x = quarterW + Math.random() * (c2.width - quarterW);
        this.y = c2.height - 15;
        this.angle = Math.random() * Math.PI / 4 - Math.PI / 6;
        this.blastSpeed = 6 + Math.random() * 7;
        this.shardCount = 15 + Math.floor(Math.random() * 15);
        this.xSpeed = Math.sin(this.angle) * this.blastSpeed;
        this.ySpeed = -Math.cos(this.angle) * this.blastSpeed;
        this.hue = Math.floor(Math.random() * 360);
        this.trail = [];
      }
      draw() {
        ctx2.save();
        ctx2.translate(this.x, this.y);
        ctx2.rotate(Math.atan2(this.ySpeed, this.xSpeed) + Math.PI / 2);
        ctx2.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
        ctx2.fillRect(0, 0, 5, 15);
        ctx2.restore();
      }
      update() {
        this.x = this.x + this.xSpeed;
        this.y = this.y + this.ySpeed;
        this.ySpeed += 0.1;
      }

      explode() {
        for (let i = 0; i < 70; i++) {
          shards.push(new Shard(this.x, this.y, this.hue));
        }
      }
    }

    console.log(GetRequest('val').val)
    // INITIALIZATION
    const [c1, c2, c3] = document.querySelectorAll('canvas');
    const [ctx1, ctx2, ctx3] = [c1, c2, c3].map(c => c.getContext('2d'));
    let fontSize = 200;
    const rockets = [];
    const shards = [];
    const targets = [];
    const fidelity = 3;
    let counter = 0;
    c2.width = c3.width = window.innerWidth;
    c2.height = c3.height = window.innerHeight;
    ctx1.fillStyle = '#000';
    const text = '铃姐,生日快乐!'
    let textWidth = 99999999;

    while (textWidth > window.innerWidth) {
      ctx1.font = `900 ${fontSize--}px Arial`;
      textWidth = ctx1.measureText(text).width;
    }

    c1.width = textWidth;
    c1.height = fontSize * 1.5;
    ctx1.font = `900 ${fontSize}px Arial`;
    ctx1.fillText(text, 0, fontSize);
    const imgData = ctx1.getImageData(0, 0, c1.width, c1.height);
    for (let i = 0, max = imgData.data.length; i < max; i += 4) {
      const alpha = imgData.data[i + 3];
      const x = Math.floor(i / 4) % imgData.width;
      const y = Math.floor(i / 4 / imgData.width);

      if (alpha && x % fidelity === 0 && y % fidelity === 0) {
        targets.push({ x, y });
      }
    }

    ctx3.fillStyle = '#FFF';
    ctx3.shadowColor = '#FFF';
    ctx3.shadowBlur = 25;

    // ANIMATION LOOP
    (function loop() {
      ctx2.fillStyle = "rgba(0, 0, 0, .1)";
      ctx2.fillRect(0, 0, c2.width, c2.height);
      counter += 1;

      if (counter % 15 === 0) {
        rockets.push(new Rocket());
      }
      rockets.forEach((r, i) => {
        r.draw();
        r.update();
        if (r.ySpeed > 0) {
          r.explode();
          rockets.splice(i, 1);
        }
      });

      shards.forEach((s, i) => {
        s.draw();
        s.update();

        if (s.timer >= s.ttl || s.lightness >= 99) {
          ctx3.fillRect(s.target.x, s.target.y, fidelity + 1, fidelity + 1);
          shards.splice(i, 1);
        }
      });

      requestAnimationFrame(loop);
    })();

    // HELPER FUNCTIONS
    const lerp = (a, b, t) => Math.abs(b - a) > 0.1 ? a + t * (b - a) : b;

    function getTarget() {
      if (targets.length > 0) {
        const idx = Math.floor(Math.random() * targets.length);
        let { x, y } = targets[idx];
        targets.splice(idx, 1);

        x += c2.width / 2 - textWidth / 2;
        y += c2.height / 2 - fontSize / 2;

        return { x, y };
      }
    }
  </script>
</body>
</html>
