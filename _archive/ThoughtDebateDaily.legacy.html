    let currentSearchDaily = "";
    let currentDateDaily = "";

    function formatParagraphs(text) {
        if (!text) return '';
        let escaped = escapeHtml(text);
        let paragraphs = escaped.split(/\n\s*\n/);
        let result = paragraphs.map(para => {
            let inner = para.replace(/\n/g, '<br>');
            if (inner.trim() === '') return '';
            return '<p>' + inner + '</p>';
        }).join('');
        return result;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m==='&') return '&amp;';
            if(m==='<') return '&lt;';
            if(m==='>') return '&gt;';
            return m;
        });
    }

    function renderDaily() {
        const container = document.getElementById('dailyContainer');
        const statsSpan = document.getElementById('statsInfoDaily');
        if (!container) return;

        let filtered = [...DAILY_JOURNAL];
        if (currentDateDaily) {
            filtered = filtered.filter(entry => entry.date === currentDateDaily);
        }
        if (currentSearchDaily.trim() !== "") {
            const kw = currentSearchDaily.trim().toLowerCase();
            filtered = filtered.filter(entry => entry.content.toLowerCase().includes(kw));
        }
        filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-data">📭 没有找到匹配的日常记录，试试清除筛选或添加新内容～</div>';
            statsSpan.innerText = `共 0 条记录`;
            return;
        }
        statsSpan.innerText = `📌 显示 ${filtered.length} 条日常${currentDateDaily ? ` (日期 ${currentDateDaily})` : ''}${currentSearchDaily ? ` (搜索: ${currentSearchDaily})` : ''}`;

        container.innerHTML = '';
        filtered.forEach(entry => {
            const card = document.createElement('div');
            card.className = 'daily-card';
            const displayDate = new Date(entry.date).toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
            const formattedContent = formatParagraphs(entry.content);
            card.innerHTML = `
                <div class="daily-header">
                    <div class="daily-title">
                        <span class="daily-date">📅 ${displayDate}</span>
                    </div>
                    <div class="toggle-icon">▼</div>
                </div>
                <div class="daily-content">
                    <div class="content-inner">${formattedContent}</div>
                </div>
            `;
            const header = card.querySelector('.daily-header');
            header.addEventListener('click', () => {
                card.classList.toggle('open');
            });
            container.appendChild(card);
        });
    }

    function initFiltersDaily() {
        const searchInput = document.getElementById('searchInputDaily');
        const dateInput = document.getElementById('dateFilterInputDaily');
        const resetBtn = document.getElementById('resetFilterBtnDaily');

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                currentSearchDaily = e.target.value;
                renderDaily();
            });
        }
        if (dateInput) {
            dateInput.addEventListener('change', (e) => {
                currentDateDaily = e.target.value;
                renderDaily();
            });
        }
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (searchInput) searchInput.value = '';
                if (dateInput) dateInput.value = '';
                currentSearchDaily = '';
                currentDateDaily = '';
                renderDaily();
            });
        }
    }

    document.getElementById('backToDebateMenuDaily').addEventListener('click', () => window.location.href = '../Selects/ThoughtDebate.html');
    document.getElementById('backToMainFromDaily').addEventListener('click', () => window.location.href = '../Secret.html');

    renderDaily();
    initFiltersDaily();
</script>
