<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>朴实文章 | 空曙</title>
<meta name="description" content="空曙的朴实文章：日常想法与思辨话题，都收在这里（需要账号访问）。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/journal.css">
</head>
<body>

<header class="topbar">
    <div class="wrap topbar-inner">
        <a class="brand" href="../Secret.html">
            <span>📖</span><span>朴实文章</span>
            <span class="brand-sub">点点滴滴 · 平实的文字</span>
        </a>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions">
            <button class="btn icon" id="settingsBtn" title="后台说明">⚙️</button>
            <button class="btn primary" id="lockBtn">🔑 登录</button>
            <button class="btn icon" id="menuBtn" title="更多">⋯</button>
            <a class="btn ghost" href="../Secret.html">← 返回主厅</a>
        </div>
    </div>
</header>

<main class="wrap">
    <section class="hero">
        <h1>📖 朴实文章</h1>
        <p>把日子过成文字，把文字过成日子。<br>日常想法与思辨话题都收在这一页：支持按日期、标签与关键词检索，登录后两人都可读写。</p>
        <div class="rule"></div>
    </section>

    <section class="stats" id="statsHost"></section>

    <section class="toolbar" id="toolbarHost">
        <div class="toolbar-row">
            <label class="search-box">
                <span aria-hidden="true">🔎</span>
                <input type="search" id="searchInput" placeholder="搜索正文、标题、心情或日期…" autocomplete="off">
                <button class="clear" id="searchClear" title="清空" hidden>✕</button>
            </label>
            <select class="picker" id="yearPicker" title="按年份筛选"><option value="all">全部年份</option></select>
            <select class="picker" id="sortPicker" title="排序方式">
                <option value="desc">最新在前</option>
                <option value="asc">最早在前</option>
            </select>
            <button class="btn sm" id="resetBtn">清除筛选</button>
        </div>
        <div class="toolbar-row"><div class="chip-row" id="tagChips"></div></div>
        <div class="meta-line" id="metaLine"></div>
    </section>

    <section class="timeline" id="timelineHost"></section>
</main>

<footer class="page-foot">⚬ 朴实无华 · 字字皆是光阴 ⚬</footer>

<script src="../assets/journal-core.js"></script>
<script>
/* 朴实文章：日记（journal）与思辨（philosophy）合并成一页；
   编辑器里可以选类型，旧的两类文章都在这里显示。 */
const app = Journal.init({
    key: 'articles',
    kinds: ['journal', 'philosophy'],
    kindLabels: { journal: '日常想法', philosophy: '思辨话题' },
    labels: {
        kind: 'journal', idPrefix: 'a',
        itemName: '文章', unit: '篇',
        newItem: '写文章', editItem: '编辑文章',
        countLabel: '📖 文章篇数', spanLabel: '🕰 记录跨度',
        charsLabel: '✍️ 累计字数', latestLabel: '🕒 最新一篇',
        emptyText: '还没有任何文章', notFoundText: '没有找到匹配的文章'
    },
    field: {
        key: 'mood', label: '心情标签', type: 'chips',
        hint: '点下面的标签快速选择，也可以自己写',
        placeholder: '例如：😌 平静',
        presets: Journal.MOODS
    },
    tagOf: e => e.mood || '',
    tagNoneLabel: '未标注',
    cardTitle: e => e.title || '',
    searchExtra: e => [e.title || '', e.mood || '', e.kind === 'philosophy' ? '思辨话题' : '日常想法']
});
app.start();
</script>
</body>
</html>
